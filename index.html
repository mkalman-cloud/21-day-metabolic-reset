const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
function programToWorkouts(){
  return HYBRID_PROGRAM.flatMap((wk,wi)=>wk.days.map((d,di)=>({id:uid(),source:'Hybrid 6 Month Full Program',programWeek:wi+1,name:`${wk.week} · ${d.name}`,shortName:d.name,schedule:d.schedule,exercises:d.exercises.map(e=>({id:uid(),name:e.name,sets:e.sets||3,reps:String(e.reps||'8-10'),target:e.target||`${e.sets}x${e.reps}`,rest:e.rest||90,increase:e.increase||0.025}))})));
}
function buildFreshDb(){return {appVersion:'hybrid-v2.1',profile:null,selectedWeek:1,workouts:programToWorkouts(),sessions:[]};}
let stored=null;try{stored=JSON.parse(localStorage.strongWeek||'null')}catch(e){stored=null}
let db=stored||buildFreshDb();
if(!db.appVersion||db.appVersion!=='hybrid-v2.1'){const oldSessions=db.sessions||[];const oldProfile=db.profile||null;db=buildFreshDb();db.sessions=oldSessions;db.profile=oldProfile;localStorage.strongWeek=JSON.stringify(db);}
const save=()=>localStorage.strongWeek=JSON.stringify(db);
let activeWorkout=null,session=null,timerInt=null,timerLeft=90,deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='block'});
installBtn.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;installBtn.style.display='none'}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');show(b.dataset.view)});
function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.add('hide'));document.getElementById(v).classList.remove('hide');render();}
function workoutPool(){return db.workouts.filter(w=>!w.programWeek||w.programWeek===Number(db.selectedWeek||1));}
function todayWorkout(){const d=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()];return workoutPool().find(w=>w.schedule===d)||workoutPool()[0]||db.workouts[0];}
function topRepNumber(repText){const nums=String(repText||'').match(/\d+/g);return nums?Number(nums[nums.length-1]):null;}
function roundWeight(v){return Math.round((Number(v)||0)*2)/2;}
function suggestion(ex){let sessions=db.sessions.flatMap(s=>s.exercises||[]).filter(e=>e.name===ex.name&&e.sets?.some(st=>st.done));if(!sessions.length)return 'Start comfortable. Add weight only with good form.';let last=sessions.at(-1);let weights=last.sets.map(s=>Number(s.weight)||0).filter(Boolean);let reps=last.sets.map(s=>parseInt(s.reps)||0);let top=topRepNumber(ex.reps);let hit=top&&reps.length&&reps.every(r=>r>=top);let max=weights.length?Math.max(...weights):0;let inc=ex.increase||0.025;if(hit&&max)return `Progression: try ${roundWeight(max*(1+inc))} kg next time.`;if(max)return `Hold around ${max} kg until you hit ${ex.reps} with good form.`;return 'Log your first weights today. Progress suggestions will appear next time.';}
function render(){profileLine.textContent=db.profile?`${db.profile.name} · ${db.profile.goal||'training'} · Week ${db.selectedWeek||1}/24`:'Create profile to personalise tracking · Hybrid 6 month program loaded';renderHome();renderWorkouts();renderAdd();renderProgress();renderProfile();}
function weekSelector(){return `<div class="card"><div class="row space"><div><h2>Hybrid 6 Month Program</h2><p class="muted">24 weeks loaded from your spreadsheet. Choose the week you are training.</p></div><span class="pill">Week ${db.selectedWeek||1} of 24</span></div><select onchange="db.selectedWeek=Number(this.value);save();render()">${HYBRID_PROGRAM.map((w,i)=>`<option value="${i+1}" ${Number(db.selectedWeek||1)===i+1?'selected':''}>${w.week}</option>`).join('')}</select></div>`;}
function renderHome(){home.innerHTML=weekSelector()+`<div class="card install"><h2>Today’s training</h2><p class="muted">Set-by-set weight tracking, rest timer, history and auto progression suggestions.</p></div>`;const w=todayWorkout();if(w)home.innerHTML+=workoutCard(w,true);}
function workoutCard(w,start=false){let count=w.exercises.length;return `<div class="card day"><div class="row space"><div><h2>${w.shortName||w.name}</h2><p class="muted small">${w.name}</p><span class="pill">${w.schedule}</span><span class="pill">${count} exercises</span>${w.programWeek?`<span class="pill">Week ${w.programWeek}</span>`:''}</div>${start?`<button class="btn green" onclick="startWorkout('${w.id}')">Start</button>`:''}</div><div style="margin-top:12px">${w.exercises.slice(0,8).map(e=>`<span class="pill">${e.name} · ${e.target||`${e.sets} x ${e.reps}`}</span>`).join('')}</div></div>`;}
function renderWorkouts(){const current=workoutPool();const custom=db.workouts.filter(w=>!w.programWeek);workouts.innerHTML=weekSelector()+`<div class="grid">${current.map(w=>`<div>${workoutCard(w,true)}<button class="btn secondary full" onclick="editWorkout('${w.id}')">Edit</button></div>`).join('')}</div>`;if(custom.length)workouts.innerHTML+=`<div class="card"><h2>Custom workouts</h2>${custom.map(w=>workoutCard(w,true)).join('')}</div>`;}
function editWorkout(id){let w=db.workouts.find(x=>x.id===id);if(!w)return;let name=prompt('Workout name',w.name);if(!name)return;w.name=name;w.shortName=name;let sched=prompt('Schedule day',w.schedule)||w.schedule;w.schedule=sched;save();render();}
function startWorkout(id){activeWorkout=db.workouts.find(w=>w.id===id);session={id:uid(),date:new Date().toISOString(),workoutId:id,workoutName:activeWorkout.name,programWeek:activeWorkout.programWeek||null,exercises:activeWorkout.exercises.map(e=>({...e,sets:Array.from({length:Number(e.sets)||3},(_,i)=>({n:i+1,weight:'',reps:'',done:false}))}))};renderSession();}
function renderSession(){document.querySelectorAll('.view').forEach(x=>x.classList.add('hide'));home.classList.remove('hide');home.innerHTML=`<div class="card"><div class="row space"><div><h2>${session.workoutName}</h2><p class="muted">Tick each set to start the rest timer.</p></div><button class="btn green" onclick="finishSession()">Finish</button></div><div class="progressbar"><span id="bar"></span></div></div>`+session.exercises.map((e,ei)=>`<div class="card ex"><h3>${e.name}</h3><p class="muted small">Target: ${e.sets.length} x ${e.reps} · ${suggestion(e)}</p><div class="sets">${e.sets.map((s,si)=>`<div class="setrow"><div class="setnum">${si+1}</div><input inputmode="decimal" placeholder="kg" value="${s.weight}" onchange="session.exercises[${ei}].sets[${si}].weight=this.value;updateBar()"><input placeholder="reps" value="${s.reps}" onchange="session.exercises[${ei}].sets[${si}].reps=this.value;updateBar()"><button class="check ${s.done?'done':''}" onclick="toggleSet(${ei},${si})">✓</button></div>`).join('')}</div></div>`).join('');updateBar();}
function updateBar(){if(!session)return;let all=session.exercises.flatMap(e=>e.sets);let done=all.filter(s=>s.done).length;let p=Math.round(done/all.length*100);let bar=document.getElementById('bar');if(bar)bar.style.width=p+'%';}
function toggleSet(ei,si){let s=session.exercises[ei].sets[si];s.done=!s.done;if(s.done)startTimer(session.exercises[ei].rest||90);renderSession();}
function finishSession(){db.sessions.push(session);save();activeWorkout=null;session=null;alert('Workout saved. Nice work.');render();}
function startTimer(sec){clearInterval(timerInt);timerLeft=sec;timer.classList.add('show');tick();timerInt=setInterval(()=>{timerLeft--;tick();if(timerLeft<=0){clearInterval(timerInt);timer.classList.remove('show');}},1000);}
function tick(){let m=String(Math.floor(timerLeft/60)).padStart(2,'0'),s=String(timerLeft%60).padStart(2,'0');timerTime.textContent=`${m}:${s}`;}
stopTimer.onclick=()=>{clearInterval(timerInt);timer.classList.remove('show')};plusTimer.onclick=()=>{timerLeft+=15;tick()};minusTimer.onclick=()=>{timerLeft=Math.max(0,timerLeft-15);tick()};
function renderAdd(){add.innerHTML=`<div class="card"><h2>Add workout by copy and paste</h2><p class="muted">Paste a workout. Use lines like “Squat 4 x 6-8” or numbered exercises. The app will build it and save it as a custom workout.</p><input id="newName" placeholder="Workout name"><input id="newDay" placeholder="Schedule day, e.g. Monday"><textarea id="pasteBox" placeholder="Paste workout here"></textarea><button class="btn green full" onclick="importWorkout()">Create workout</button></div>`;}
function importWorkout(){let name=newName.value||'New Workout',day=newDay.value||'Any day',lines=pasteBox.value.split('\n').map(l=>l.trim()).filter(Boolean);let exercises=[];for(let l of lines){let m=l.match(/^(?:\d+[\).]\s*)?(.+?)\s+(\d+)\s*x\s*([\w\-–\/\s]+)$/i);if(m)exercises.push({id:uid(),name:m[1].replace(/[•\-]+$/,'').trim(),sets:+m[2],reps:m[3].trim(),target:`${m[2]}x${m[3].trim()}`,rest:db.profile?.rest||90,increase:.025});}if(!exercises.length)return alert('I could not find exercises. Try: Squat 4 x 6-8');db.workouts.push({id:uid(),name,schedule:day,exercises});save();show('workouts');}
function renderProgress(){let total=db.sessions.length;let sets=db.sessions.flatMap(s=>s.exercises.flatMap(e=>e.sets)).filter(s=>s.done).length;let volume=db.sessions.reduce((sum,s)=>sum+s.exercises.reduce((a,e)=>a+e.sets.reduce((b,st)=>b+((Number(st.weight)||0)*(Number(st.reps)||0)),0),0),0);progress.innerHTML=`<div class="grid"><div class="stat"><span class="muted">Workouts saved</span><br><b>${total}</b></div><div class="stat"><span class="muted">Sets completed</span><br><b>${sets}</b></div><div class="stat"><span class="muted">Total volume</span><br><b>${Math.round(volume)} kg</b></div></div><div class="card"><h2>Recent sessions</h2>${db.sessions.slice(-10).reverse().map(s=>`<p><b>${s.workoutName}</b><br><span class="muted">${new Date(s.date).toLocaleString()}</span></p>`).join('')||'<p class="muted">No sessions yet.</p>'}</div>`;}
function renderProfile(){profile.innerHTML=`<div class="card"><h2>Your profile</h2><input id="pName" placeholder="Name" value="${db.profile?.name||''}"><input id="pGoal" placeholder="Goal, e.g. build muscle and fitness" value="${db.profile?.goal||''}"><select id="pRest"><option value="90">Default rest: 90 sec</option><option value="60">Default rest: 60 sec</option><option value="120">Default rest: 120 sec</option></select><button class="btn green full" onclick="saveProfile()">Save profile</button></div><div class="card"><h2>Backup</h2><p class="muted">Export keeps your data safe when changing phones.</p><button class="btn secondary full" onclick="exportData()">Export data</button><br><br><input type="file" id="importFile" onchange="importData(event)"></div><div class="card"><h2>Reset program</h2><p class="muted">Reloads the 24-week program from your spreadsheet. Your sessions stay saved.</p><button class="btn secondary full" onclick="resetProgram()">Reload hybrid program</button></div>`;}
function saveProfile(){db.profile={name:pName.value||'User',goal:pGoal.value||'Strength and fitness',rest:+pRest.value};db.workouts.forEach(w=>w.exercises.forEach(e=>e.rest=db.profile.rest));save();render();}
function resetProgram(){const old=db.sessions||[],prof=db.profile||null;db=buildFreshDb();db.sessions=old;db.profile=prof;save();render();alert('Hybrid program reloaded.');}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='strong-week-backup.json';a.click();}
function importData(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{db=JSON.parse(r.result);save();render();};r.readAsText(f);}
render();
</script>
</body></html>
