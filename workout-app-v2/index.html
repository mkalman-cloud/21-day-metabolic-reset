<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forge</title>
  <meta name="theme-color" content="#020817" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    :root{--bg:#020817;--card:#0f172a;--line:#26344d;--text:#f8fafc;--muted:#94a3b8;--green:#34d399;--blue:#60a5fa;--red:#fb7185;--yellow:#facc15}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#172554,#020817 55%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
    header{background:rgba(2,8,23,.92);border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:9}.top{max-width:1180px;margin:auto;padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#64748b,#0f172a);border:1px solid #475569;display:grid;place-items:center;font-weight:900}
    h1,h2,h3{margin:0 0 10px}.sub,.muted{color:var(--muted)}.small{font-size:12px} main{max-width:1180px;margin:auto;padding:16px}
    .card{background:linear-gradient(180deg,rgba(15,23,42,.96),rgba(17,24,39,.96));border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 18px 50px rgba(0,0,0,.32)}.banner{background:linear-gradient(135deg,#1e3a8a,#312e81)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}input,select,textarea{width:100%;background:#07111f;border:1px solid var(--line);border-radius:14px;padding:13px;color:var(--text);font:inherit;margin-bottom:8px}textarea{min-height:90px}
    button{border:0;border-radius:14px;padding:12px 15px;font-weight:800;cursor:pointer;background:var(--blue);color:#06101f}.green{background:var(--green)}.secondary{background:#1f2937;color:white;border:1px solid var(--line)}.red{background:#3b1220;color:#fecdd3;border:1px solid #7f1d1d}.full{width:100%}
    .tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}.tab{background:#111827;color:var(--muted);border:1px solid var(--line)}.tab.active{background:white;color:#020817}.hide{display:none!important}
    .pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--muted);font-size:12px;margin:3px;background:#07111f}.pill.green{color:#bbf7d0;border-color:#14532d}.pill.yellow{color:#fde68a;border-color:#713f12}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.exercise{border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;background:#08111f}.setrow{display:grid;grid-template-columns:40px 1fr 1fr 52px;gap:8px;margin:8px 0;align-items:center}.done{background:var(--green)}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;z-index:40}.modal.show{display:flex}.sheet{width:100%;max-width:950px;margin:0 auto;background:#0f172a;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:16px;max-height:88vh;overflow:auto}canvas{width:100%;height:260px;background:#07111f;border:1px solid var(--line);border-radius:16px;padding:10px}
    @media(max-width:760px){.tabs{grid-template-columns:repeat(3,1fr)}.setrow{grid-template-columns:32px 1fr 1fr 42px}}
  </style>
</head>
<body>
<header><div class="top"><div class="brand"><div class="logo">F</div><div><h2>Move With Intent</h2><div class="sub" id="profileLine">Forge Cloud</div></div></div><button id="topLogout" class="secondary hide" onclick="logout()">Log out</button></div></header>
<main>
  <div id="status" class="card banner"><h1>Forge</h1><p class="muted">Syncing Forge Cloud...</p></div>
  <section id="authView">
    <div class="grid">
      <div class="card"><h2>Log in</h2><input id="loginEmail" placeholder="Email"><input id="loginPassword" type="password" placeholder="Password"><button class="green full" onclick="login()">Log in</button></div>
      <div class="card"><h2>Create client account</h2><input id="signupName" placeholder="Full name"><input id="signupEmail" placeholder="Email"><input id="signupPassword" type="password" placeholder="Password"><input id="signupDob" type="date"><input id="signupEmergencyName" placeholder="Emergency contact name"><input id="signupEmergencyPhone" placeholder="Emergency contact phone"><button class="green full" onclick="signup()">Create account</button><p class="muted small">Clients are assigned to Marcell automatically.</p></div>
    </div>
  </section>
  <section id="appView" class="hide"><div id="tabs" class="tabs"></div><div id="phaseBand"></div><div id="today" class="view"></div><div id="program" class="view hide"></div><div id="progress" class="view hide"></div><div id="clients" class="view hide"></div><div id="requests" class="view hide"></div><div id="settings" class="view hide"></div></section>
</main>
<div id="modal" class="modal"><div class="sheet"><div id="modalBody"></div><button class="secondary full" onclick="closeModal()">Close</button></div></div>
<script>
const PERMANENT_COACH_EMAIL="marcell.fitness@gmail.com";
let supabaseClient,currentUser=null,currentProfile=null,activeView="today",activeSession=null,selectedClientState=null;
function el(id){return document.getElementById(id)} function setStatus(t,ok=true){el("status").innerHTML=`<h1>Forge</h1><p class="muted">${ok?"✅":"❌"} ${t}</p>`} function hideStatus(){setTimeout(()=>el("status").classList.add("hide"),700)}
function isCoachEmail(e){return String(e||"").toLowerCase()===PERMANENT_COACH_EMAIL}
const PHASES=[["Foundation","Weeks 1-6"],["Strength Build","Weeks 7-12"],["Intensification","Weeks 13-18"],["Performance + Athletic Look","Weeks 19-24"]];
const PROGRAM=[
{day:"Day 1 - Lower Body Strength + Engine",schedule:"Monday",exercises:[["Warm-Up","Incline treadmill walk",1,5,"min","incline"],["Warm-Up","Bodyweight squats",1,15,"reps","bodyweight"],["Warm-Up","Lunges",1,10,"each leg","bodyweight"],["Main Lift","Barbell Squat",5,5,"reps","main"],["Secondary","Romanian Deadlift",3,8,"reps","other"],["Secondary","Leg Press",3,10,"reps","other"],["Functional","Walking Lunges (DB)",3,10,"each leg","other"],["Functional","Leg Curl",3,12,"reps","other"],["Conditioning","Incline treadmill walk, steady moderate effort",1,12,"min","incline"],["Finisher / Cool Down","Plank",2,60,"seconds","duration_bodyweight"]]},
{day:"Day 2 - Upper Body Strength + Work Capacity",schedule:"Wednesday",exercises:[["Warm-Up","Row machine",1,5,"min","duration"],["Warm-Up","Band pull-aparts",1,15,"reps","bodyweight"],["Main Lift","Bench Press",5,5,"reps","main"],["Secondary","Lat Pulldown or Pull-ups",3,10,"reps","other"],["Secondary","Seated Row",3,10,"reps","other"],["Functional","Dumbbell Shoulder Press",3,10,"reps","other"],["Functional","Triceps Pushdown",3,12,"reps","other"],["Conditioning","Bike steady pace, heart rate in green zone",1,12,"min","duration"]]},
{day:"Day 3 - Full Body Strength + Conditioning",schedule:"Friday",exercises:[["Warm-Up","Row machine",1,5,"min","duration"],["Warm-Up","Dynamic hip mobility",1,1,"min each leg","duration"],["Main Lift","Deadlift",5,5,"reps","main"],["Power","Push Press",3,6,"reps","other"],["Power","Step-Ups",3,8,"reps","other"],["Functional","Walking Lunges",3,10,"each leg","bodyweight"],["Functional","Cable Woodchoppers",3,12,"each side","other"],["Conditioning","Treadmill intervals, 1 min run / 1 min walk",8,1,"round","speed"],["Finisher / Cool Down","Push-ups",2,12,"reps","bodyweight"],["Finisher / Cool Down","Plank",1,60,"seconds","duration_bodyweight"]]}];
async function init(){try{supabaseClient=window.supabase.createClient(window.STRONG_WEEK_CONFIG.supabaseUrl,window.STRONG_WEEK_CONFIG.supabaseAnonKey);const {data}=await supabaseClient.auth.getSession();currentUser=data.session?.user||null;if(currentUser){await loadProfile();await ensureClientState(currentProfile.id)}setStatus("Forge Cloud ready");hideStatus();render();supabaseClient.auth.onAuthStateChange(async(e,s)=>{currentUser=s?.user||null;if(currentUser){await loadProfile();await ensureClientState(currentProfile.id)}render()})}catch(err){console.error(err);setStatus(err.message||String(err),false)}}
async function getCoachProfile(){const {data}=await supabaseClient.from("profiles").select("*").eq("email",PERMANENT_COACH_EMAIL).maybeSingle();return data}
async function loadProfile(){const {data}=await supabaseClient.from("profiles").select("*").eq("id",currentUser.id).maybeSingle();if(data)currentProfile=data;else{const isCoach=isCoachEmail(currentUser.email),coach=isCoach?null:await getCoachProfile();const payload={id:currentUser.id,email:currentUser.email,full_name:currentUser.email,role:isCoach?"coach":"client",coach_id:isCoach?null:(coach?.id||null)};await supabaseClient.from("profiles").insert(payload);currentProfile=payload}if(isCoachEmail(currentUser.email)&&currentProfile.role!=="coach"){await supabaseClient.from("profiles").update({role:"coach",email:currentUser.email,coach_id:null}).eq("id",currentUser.id);currentProfile.role="coach"}}
async function ensureClientState(id){let {data}=await supabaseClient.from("client_states").select("*").eq("client_id",id).maybeSingle();if(!data){const res=await supabaseClient.from("client_states").insert({client_id:id,current_week:1,week_locked:false}).select().single();data=res.data}selectedClientState=data||{current_week:1,week_locked:false};return selectedClientState}
async function login(){try{const email=el("loginEmail").value.trim(),password=el("loginPassword").value.trim();if(!email||!password)return alert("Enter email and password");const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)return alert(error.message);currentUser=data.user;await loadProfile();await ensureClientState(currentProfile.id);activeView="today";render()}catch(err){alert("Login error: "+(err.message||err));console.error(err)}}
async function signup(){try{const email=el("signupEmail").value.trim(),password=el("signupPassword").value.trim(),name=el("signupName").value.trim(),dob=el("signupDob").value,eName=el("signupEmergencyName").value.trim(),ePhone=el("signupEmergencyPhone").value.trim(),isCoach=isCoachEmail(email);if(!email||!password||!name)return alert("Add name, email and password");if(!isCoach){if(!dob||!eName||!ePhone)return alert("Clients must add DOB and emergency contact");if(name.toLowerCase()===eName.toLowerCase())return alert("Emergency contact cannot be same as client")}const coach=isCoach?null:await getCoachProfile();const {data,error}=await supabaseClient.auth.signUp({email,password});if(error)return alert(error.message);if(data.user){await supabaseClient.from("profiles").insert({id:data.user.id,email,full_name:name,role:isCoach?"coach":"client",coach_id:isCoach?null:(coach?.id||null),date_of_birth:isCoach?null:dob,emergency_contact_name:isCoach?"":eName,emergency_contact_phone:isCoach?"":ePhone});await supabaseClient.from("client_states").insert({client_id:data.user.id,current_week:1,week_locked:false})}alert("Account created")}catch(err){alert("Signup error: "+(err.message||err));console.error(err)}}
async function logout(){try{await supabaseClient.auth.signOut({scope:"global"})}catch(e){}localStorage.clear();sessionStorage.clear();location.href=location.pathname+"?logout="+Date.now()}
function render(){const logged=!!currentUser;el("authView").classList.toggle("hide",logged);el("appView").classList.toggle("hide",!logged);el("topLogout").classList.toggle("hide",!logged);if(!logged){el("profileLine").textContent="Forge Cloud";return}el("profileLine").textContent=`${currentProfile.full_name||currentUser.email} · ${currentProfile.role}`;renderTabs();renderPhase();renderToday();renderProgram();renderProgress(currentProfile.id);renderClients();renderSettings();show(activeView,true)}
function renderTabs(){const items=currentProfile.role==="coach"?[["today","Today"],["program","Program"],["progress","Progress"],["clients","Clients"],["requests","Requests"],["settings","Settings"]]:[["today","Today"],["program","Program"],["progress","Progress"],["requests","Requests"],["settings","Settings"]];el("tabs").innerHTML=items.map(([v,l])=>`<button class="tab ${activeView===v?"active":""}" onclick="show('${v}')">${l}</button>`).join("")}
function show(v,silent=false){if(v==="clients"&&currentProfile.role!=="coach")v="today";activeView=v;document.querySelectorAll(".view").forEach(x=>x.classList.add("hide"));el(v)?.classList.remove("hide");document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.textContent.toLowerCase()===v));if(!silent)render()}
function week(){return selectedClientState?.current_week||1} function renderPhase(){const idx=Math.min(3,Math.floor((week()-1)/6)),p=PHASES[idx];el("phaseBand").innerHTML=`<div class="card banner"><h2>📅 Phase ${idx+1} - ${p[0]}</h2><p class="muted">${p[1]}</p><span class="pill ${selectedClientState?.week_locked?"yellow":"green"}">Week ${week()} ${selectedClientState?.week_locked?"Locked":"Auto"}</span></div>`}
function todayWorkout(){const d=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date().getDay()];return PROGRAM.find(w=>w.schedule===d)||PROGRAM[0]}
function workoutCard(w){return `<div class="card"><div class="row space"><div><h2>${w.day}</h2><span class="pill">${w.schedule}</span><span class="pill">Week ${week()}</span></div><div class="row"><button class="secondary" onclick="previewWorkout('${w.day}')">Open</button><button class="green" onclick="startWorkout('${w.day}')">Start</button></div></div></div>`}
function renderToday(){el("today").innerHTML=`<div class="card"><h2>Today</h2><p class="muted">Complete 3 workouts to progress unless coach locks the week.</p></div>${activeSession?`<div class="card banner"><h2>Workout in progress</h2><button class="green" onclick="renderSession()">Resume</button></div>`:workoutCard(todayWorkout())}`}
function renderProgram(){el("program").innerHTML=`<div class="card"><h2>Program</h2><p class="muted">Open to preview. Start to log.</p></div>${PROGRAM.map(workoutCard).join("")}`}
function startWorkout(day){const w=PROGRAM.find(x=>x.day===day);activeSession={id:crypto.randomUUID(),start:Date.now(),week:week(),workout:w.day,exercises:w.exercises.map(e=>({section:e[0],name:e[1],sets:e[2],target:e[3],unit:e[4],type:e[5],logs:Array.from({length:e[2]},(_,i)=>({set:i+1,value:"",reps:e[3],done:false}))}))};renderSession()}
function renderSession(){activeView="today";el("today").innerHTML=`<div class="card"><h2>${activeSession.workout}</h2><button class="green" onclick="openRecovery()">Finish workout</button></div>${activeSession.exercises.map((e,ei)=>`<div class="card"><h3>${e.name}</h3><p class="muted">${e.section} · ${e.sets} x ${e.target} ${e.unit}</p><textarea placeholder="Notes" onchange="activeSession.exercises[${ei}].comment=this.value"></textarea>${e.logs.map((l,li)=>`<div class="setrow"><span>${li+1}</span><input placeholder="${label1(e)}" onchange="activeSession.exercises[${ei}].logs[${li}].value=this.value"><input placeholder="${label2(e)}" value="${l.reps}" onchange="activeSession.exercises[${ei}].logs[${li}].reps=this.value"><button onclick="activeSession.exercises[${ei}].logs[${li}].done=!activeSession.exercises[${ei}].logs[${li}].done;this.classList.toggle('done')">✓</button></div>`).join("")}</div>`).join("")}`;show("today",true)}
function label1(e){return e.type==="speed"?"Speed Level":e.type==="incline"?"Incline Level":(e.type==="bodyweight"||e.type==="duration_bodyweight")?"Body Weight":e.type==="duration"?"Duration":"kg"} function label2(e){return (e.type==="duration"||e.type==="duration_bodyweight")?"min/sec":e.type==="speed"?"Speed/round":e.type==="incline"?"duration":"reps"}
function openRecovery(){modalBody.innerHTML=`<h2>Post-workout check-in</h2><label>Tired?</label><select id="r_tired"><option>Fresh</option><option>Moderately tired</option><option>Very tired</option></select><label>Body comfort?</label><select id="r_body"><option>Comfortable and mobile</option><option>A little stiff</option><option>Aches/pains or very stiff</option></select><label>Workout difficulty?</label><select id="r_hard"><option>Have left a lot in the tank</option><option>Just right</option><option>I am buggered</option></select><label>Sleep?</label><select id="r_sleep"><option>Very good sleep, I am full of energy</option><option>Disturbed but good rest</option><option>Disturbed and tired</option><option>Not disturbed but tired</option></select><button class="green full" onclick="finishWorkout()">Save workout</button>`;el("modal").classList.add("show")}
async function finishWorkout(){const duration=Math.round((Date.now()-activeSession.start)/60000)||1;const {data:s,error}=await supabaseClient.from("workout_sessions").insert({client_id:currentProfile.id,coach_id:currentProfile.coach_id,week:activeSession.week,workout_name:activeSession.workout,duration_minutes:duration}).select().single();if(error)return alert(error.message);const rows=activeSession.exercises.flatMap(e=>e.logs.map(l=>({session_id:s.id,client_id:currentProfile.id,exercise:e.name,exercise_type:e.type,week:activeSession.week,set_number:l.set,metric_value:Number(l.value)||0,reps_or_duration:Number(l.reps)||0,unit:e.unit,comment:e.comment||""})));await supabaseClient.from("exercise_logs").insert(rows);await supabaseClient.from("recovery_logs").insert({session_id:s.id,client_id:currentProfile.id,week:activeSession.week,tired:el("r_tired").value,body_comfort:el("r_body").value,workout_difficulty:el("r_hard").value,sleep_quality:el("r_sleep").value});await maybeProgressWeek(currentProfile.id);activeSession=null;closeModal();alert("Workout saved");activeView="progress";await ensureClientState(currentProfile.id);render()}
async function maybeProgressWeek(id){const st=await ensureClientState(id);if(st.week_locked)return;const {count}=await supabaseClient.from("workout_sessions").select("*",{count:"exact",head:true}).eq("client_id",id).eq("week",st.current_week);if((count||0)>=3)await supabaseClient.from("client_states").update({current_week:st.current_week+1}).eq("client_id",id)}
async function renderProgress(id=currentProfile.id){const {data:sessions=[]}=await supabaseClient.from("workout_sessions").select("*").eq("client_id",id).order("created_at",{ascending:false});const {data:logs=[]}=await supabaseClient.from("exercise_logs").select("*").eq("client_id",id);const {data:recovery=[]}=await supabaseClient.from("recovery_logs").select("*").eq("client_id",id);el("progress").innerHTML=`<div class="grid"><div class="card"><h2>${sessions.length}</h2><p class="muted">Completed workouts</p></div><div class="card"><h2>${sessions[0]?.duration_minutes||0} min</h2><p class="muted">Last workout duration</p></div></div><div class="grid"><div class="card"><h3>Kg gain / week</h3><canvas id="kgChart"></canvas></div><div class="card"><h3>Speed gain / week</h3><canvas id="speedChart"></canvas></div><div class="card"><h3>Duration / week</h3><canvas id="durationChart"></canvas></div><div class="card"><h3>Recovery trends</h3><canvas id="recoveryChart"></canvas></div></div><div class="card"><h2>Workout history</h2>${sessions.map(s=>`<div class="exercise"><b>${s.workout_name}</b><p class="muted">Week ${s.week} · ${s.duration_minutes} min · ${new Date(s.created_at).toLocaleString()}</p></div>`).join("")||"<p class='muted'>No workouts yet.</p>"}</div>`;setTimeout(()=>drawCharts(logs,recovery),50)}
function drawCharts(logs,recovery){drawChart("kgChart",group(logs,"main","metric_value"));drawChart("speedChart",group(logs,"speed","metric_value"));drawChart("durationChart",group(logs,"duration_bodyweight","reps_or_duration"));drawChart("recoveryChart",recovery.reduce((a,r)=>{a[r.week]=(a[r.week]||0)+1;return a},{}))}
function group(logs,type,field){const m={};logs.filter(x=>x.exercise_type===type).forEach(x=>m[x.week]=Math.max(m[x.week]||0,Number(x[field])||0));return m}
function drawChart(id,data){const c=el(id);if(!c)return;const ctx=c.getContext("2d");c.width=c.clientWidth*2;c.height=260*2;ctx.scale(2,2);ctx.clearRect(0,0,c.width,c.height);const keys=Object.keys(data).sort((a,b)=>a-b),vals=keys.map(k=>data[k]),max=Math.max(1,...vals);ctx.strokeStyle="#60a5fa";ctx.lineWidth=3;ctx.beginPath();keys.forEach((k,i)=>{const x=30+i*((c.clientWidth-60)/Math.max(1,keys.length-1)),y=220-(vals[i]/max)*170;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);ctx.fillStyle="#94a3b8";ctx.fillText("W"+k,x-8,240);ctx.fillText(String(vals[i]),x-8,y-8)});ctx.stroke()}
async function renderClients(){if(currentProfile.role!=="coach"){el("clients").innerHTML="";return}const {data:clients=[]}=await supabaseClient.from("profiles").select("*").eq("coach_id",currentProfile.id).order("full_name",{ascending:true});el("clients").innerHTML=`<div class="card"><h2>Clients</h2><p class="muted">Assign weeks, lock progress, open profiles, and comment on exercises.</p></div>${clients.map(c=>`<div class="card"><div class="row space"><div><h2>${c.full_name||c.email}</h2><p class="muted">${c.email||""}</p><p>DOB: ${c.date_of_birth||"Not added"}</p><p>Emergency: ${c.emergency_contact_name||"Not added"} ${c.emergency_contact_phone||""}</p></div><button class="green" onclick="openClient('${c.id}')">Open profile</button></div></div>`).join("")||"<div class='card'>No clients yet.</div>"}`}
async function openClient(id){const {data:p}=await supabaseClient.from("profiles").select("*").eq("id",id).single();const st=await ensureClientState(id);modalBody.innerHTML=`<h2>${p.full_name||p.email}</h2><p class="muted">${p.email}</p><label>Start/current week</label><input id="clientWeek" type="number" min="1" max="24" value="${st.current_week}"><label>Lock week</label><select id="clientLock"><option value="false" ${!st.week_locked?"selected":""}>Auto progress after 3 workouts</option><option value="true" ${st.week_locked?"selected":""}>Locked by coach</option></select><button class="green full" onclick="saveClientWeek('${id}')">Save assignment</button><br><br><button class="secondary full" onclick="showClientProgress('${id}')">Show progress charts</button><h3>Coach exercise comment</h3><input id="commentExercise" placeholder="Exercise name"><textarea id="commentText" placeholder="Comment/cue"></textarea><button class="green full" onclick="saveCoachComment('${id}')">Save comment</button>`;el("modal").classList.add("show")}
async function saveClientWeek(id){await supabaseClient.from("client_states").upsert({client_id:id,current_week:Number(el("clientWeek").value),week_locked:el("clientLock").value==="true"});alert("Client week updated")}
async function showClientProgress(id){closeModal();activeView="progress";await renderProgress(id);show("progress",true)}
async function saveCoachComment(id){await supabaseClient.from("coach_comments").insert({client_id:id,coach_id:currentProfile.id,exercise:el("commentExercise").value,comment:el("commentText").value});alert("Comment saved")}
function previewWorkout(day){const w=PROGRAM.find(x=>x.day===day);modalBody.innerHTML=`<h2>${w.day}</h2>${w.exercises.map(e=>`<div class="exercise"><b>${e[0]}:</b> ${e[1]} · ${e[2]} x ${e[3]} ${e[4]}</div>`).join("")}`;el("modal").classList.add("show")} function closeModal(){el("modal").classList.remove("show")} function renderRequests(){el("requests").innerHTML=`<div class="card"><h2>Requests</h2><p class="muted">Substitution requests and coach feedback will live here.</p></div>`} function renderSettings(){el("settings").innerHTML=`<div class="card"><h2>Settings</h2><p class="muted">${currentUser.email} · ${currentProfile.role}</p><button class="red full" onclick="logout()">Force log out</button></div>`}
init();
</script>
</body>
</html>
