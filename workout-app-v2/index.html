<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forge v4.2 Phase 2</title>
  <meta name="theme-color" content="#020817" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    :root{
      --bg:#020817;--card:#0f172a;--card2:#111827;--line:#26344d;--text:#f8fafc;--muted:#94a3b8;
      --green:#34d399;--blue:#60a5fa;--red:#fb7185;--yellow:#facc15;--purple:#8b5cf6;
    }
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at top,#172554,#020817 55%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
    header{position:sticky;top:0;z-index:10;background:rgba(2,8,23,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08)}
    .top{max-width:1180px;margin:auto;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
    .brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#64748b,#0f172a);border:1px solid #475569;display:grid;place-items:center;font-weight:900}
    main{max-width:1180px;margin:auto;padding:16px} h1,h2,h3{margin:0 0 10px}.muted,.sub{color:var(--muted)}.small{font-size:12px}
    .card{background:linear-gradient(180deg,rgba(15,23,42,.96),rgba(17,24,39,.96));border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
    .banner{background:linear-gradient(135deg,#1e3a8a,#312e81)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
    input,select,textarea{width:100%;background:#07111f;border:1px solid var(--line);border-radius:14px;padding:13px;color:var(--text);font:inherit;margin-bottom:8px}
    textarea{min-height:90px} label{display:block;margin:8px 0 4px;color:var(--muted);font-size:12px}
    button{border:0;border-radius:14px;padding:12px 15px;font-weight:800;cursor:pointer;background:var(--blue);color:#06101f}
    button:hover{filter:brightness(1.05)} button:disabled{opacity:.5;cursor:not-allowed}
    .green{background:var(--green)}.secondary{background:#1f2937;color:white;border:1px solid var(--line)}.red{background:#3b1220;color:#fecdd3;border:1px solid #7f1d1d}.full{width:100%}
    .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.tab{background:#111827;color:var(--muted);border:1px solid var(--line)}.tab.active{background:white;color:#020817}
    .hide{display:none!important}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}
    .pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--muted);font-size:12px;margin:3px;background:#07111f}.pill.green{color:#bbf7d0;border-color:#14532d}.pill.yellow{color:#fde68a;border-color:#713f12}.pill.red{color:#fecdd3;border-color:#7f1d1d}
    .exercise{border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;background:#08111f}.miniTabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}.miniTab{background:#111827;color:var(--muted);border:1px solid var(--line)}.miniTab.active{background:#e5e7eb;color:#020817}.alertBox{border-left:4px solid var(--yellow);padding:10px;background:#111827;border-radius:12px;margin:8px 0}.alertBox.redFlag{border-left-color:var(--red)}
    .setrow{display:grid;grid-template-columns:36px 1fr 1fr 46px;gap:8px;margin:8px 0;align-items:center}.done{background:var(--green)}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;z-index:50}.modal.show{display:flex}
    .sheet{width:100%;max-width:980px;margin:0 auto;background:#0f172a;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:16px;max-height:88vh;overflow:auto}
    canvas{width:100%;height:240px;background:#07111f;border:1px solid var(--line);border-radius:16px}
    @media(max-width:760px){.tabs{grid-template-columns:repeat(2,1fr)}.setrow{grid-template-columns:30px 1fr 1fr 40px}.top{align-items:flex-start}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand"><div class="logo">F</div><div><h2>Move With Intent</h2><div class="sub" id="profileLine">Forge Cloud</div></div></div>
    <button id="topLogout" class="secondary hide" onclick="logout()">Log out</button>
  </div>
</header>

<main>
  <div id="status" class="card banner"><h1>Forge</h1><p class="muted">Syncing Forge Cloud...</p></div>

  <section id="authView">
    <div class="grid">
      <div class="card">
        <h2>Log in</h2>
        <input id="loginEmail" placeholder="Email" autocomplete="email">
        <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
        <button class="green full" onclick="login()">Log in</button>
      </div>
      <div class="card">
        <h2>Create client account</h2>
        <input id="signupName" placeholder="Full name">
        <input id="signupEmail" placeholder="Email">
        <input id="signupPassword" type="password" placeholder="Password">
        <input id="signupDob" type="date">
        <input id="signupEmergencyName" placeholder="Emergency contact name">
        <input id="signupEmergencyPhone" placeholder="Emergency contact phone">
        <button class="green full" onclick="signup()">Create account</button>
        <p class="muted small">Clients are automatically assigned to Marcell as coach.</p>
      </div>
    </div>
  </section>

  <section id="appView" class="hide">
    <div id="tabs" class="tabs"></div>
    <div id="phaseBand"></div>
    <div id="today" class="view"></div>
    <div id="program" class="view hide"></div>
    <div id="clients" class="view hide"></div>
    <div id="profile" class="view hide"></div>
    <div id="settings" class="view hide"></div>
  </section>
</main>

<div id="modal" class="modal"><div class="sheet"><div id="modalBody"></div><button class="secondary full" onclick="closeModal()">Close</button></div></div>

<script>
const PERMANENT_COACH_EMAIL="marcell.fitness@gmail.com";
let supabaseClient=null,currentUser=null,currentProfile=null,clientState=null,activeView="today",activeSession=null;

const PHASES=[
  ["Foundation","Weeks 1-6","Technique · control · base conditioning"],
  ["Strength Build","Weeks 7-12","Progressive overload · strength increase"],
  ["Intensification","Weeks 13-18","Heavier work · power output"],
  ["Performance","Weeks 19-24","Strength + conditioning · athletic look"]
];

const PROGRAMS={
  forge_hybrid:{
    name:"Forge Hybrid 3-Day",
    description:"Functional strength, conditioning, bodyweight control, and athletic work.",
    schedule:[
      {day:"Day 1 - Lower Body Strength + Engine",schedule:"Monday",exercises:[["Warm-Up","Incline treadmill walk",1,5,"min","incline"],["Warm-Up","Bodyweight squats",1,15,"reps","bodyweight"],["Warm-Up","Lunges",1,10,"each leg","bodyweight"],["Main Lift","Barbell Squat",5,5,"reps","main"],["Secondary","Romanian Deadlift",3,8,"reps","other"],["Secondary","Leg Press",3,10,"reps","other"],["Functional","Walking Lunges (DB)",3,10,"each leg","other"],["Conditioning","Incline treadmill walk",1,12,"min","incline"],["Finisher","Plank",2,60,"seconds","duration_bodyweight"]]},
      {day:"Day 2 - Upper Body Strength + Work Capacity",schedule:"Wednesday",exercises:[["Warm-Up","Row machine",1,5,"min","duration"],["Main Lift","Bench Press",5,5,"reps","main"],["Secondary","Lat Pulldown or Pull-ups",3,10,"reps","other"],["Secondary","Seated Row",3,10,"reps","other"],["Functional","Dumbbell Shoulder Press",3,10,"reps","other"],["Conditioning","Bike steady pace, green zone",1,12,"min","duration"]]},
      {day:"Day 3 - Full Body Strength + Conditioning",schedule:"Friday",exercises:[["Warm-Up","Row machine",1,5,"min","duration"],["Main Lift","Deadlift",5,5,"reps","main"],["Power","Push Press",3,6,"reps","other"],["Functional","Walking Lunges",3,10,"each leg","bodyweight"],["Conditioning","Treadmill intervals, 1 min run / 1 min walk",8,1,"round","speed"],["Finisher","Push-ups",2,12,"reps","bodyweight"],["Finisher","Plank",1,60,"seconds","duration_bodyweight"]]}
    ]
  },
  metabolic_21:{
    name:"21-Day Metabolic Reset",
    description:"A 21-day reset focused on consistency, conditioning, mobility, simple strength work, and habit momentum.",
    schedule:[
      {day:"Day 1 - Reset Strength + Zone 2",schedule:"Monday",exercises:[["Warm-Up","Incline treadmill walk",1,6,"min","incline"],["Mobility","Hip openers",1,60,"seconds","duration_bodyweight"],["Strength","Goblet Squat",3,10,"reps","other"],["Strength","Dumbbell Bench Press",3,10,"reps","other"],["Strength","Seated Row",3,12,"reps","other"],["Core","Plank",2,45,"seconds","duration_bodyweight"],["Conditioning","Bike steady pace",1,15,"min","duration"]]},
      {day:"Day 2 - Conditioning + Core",schedule:"Wednesday",exercises:[["Warm-Up","Row machine",1,5,"min","duration"],["Conditioning","Treadmill intervals, 1 min run / 1 min walk",8,1,"round","speed"],["Strength","Walking Lunges",3,10,"each leg","bodyweight"],["Strength","Lat Pulldown",3,12,"reps","other"],["Core","Cable Woodchoppers",3,12,"each side","other"],["Cool Down","Incline treadmill walk",1,8,"min","incline"]]},
      {day:"Day 3 - Full Body Reset",schedule:"Friday",exercises:[["Warm-Up","Bike easy pace",1,5,"min","duration"],["Strength","Leg Press",3,12,"reps","other"],["Strength","Dumbbell Shoulder Press",3,10,"reps","other"],["Strength","Romanian Deadlift",3,10,"reps","other"],["Bodyweight","Push-ups",3,12,"reps","bodyweight"],["Core","Plank",3,45,"seconds","duration_bodyweight"],["Conditioning","Row machine steady pace",1,12,"min","duration"]]}
    ]
  },
  stronglifts_5x5:{
    name:"StrongLifts 5×5",
    description:"Simple compound barbell strength program for strength, muscle, and athleticism. Squat every workout. Add weight gradually.",
    schedule:[
      {day:"Workout A - Squat, Bench, Row",schedule:"Monday",exercises:[["Main Lift","Barbell Back Squat",5,5,"reps","main"],["Main Lift","Barbell Bench Press",5,5,"reps","main"],["Main Lift","Barbell Row",5,5,"reps","main"],["Optional","Plank",3,45,"seconds","duration_bodyweight"]]},
      {day:"Workout B - Squat, Overhead Press, Deadlift",schedule:"Wednesday",exercises:[["Main Lift","Barbell Back Squat",5,5,"reps","main"],["Main Lift","Barbell Overhead Press",5,5,"reps","main"],["Main Lift","Barbell Deadlift",1,5,"reps","main"],["Optional","Incline treadmill walk",1,10,"min","incline"]]},
      {day:"Workout A/B Alternating - Follow Week Cycle",schedule:"Friday",exercises:[["Main Lift","Barbell Back Squat",5,5,"reps","main"],["Main Lift","Alternate Bench or Overhead Press",5,5,"reps","main"],["Main Lift","Alternate Row or Deadlift",5,5,"reps","main"],["Note","Add weight every 2-week cycle. Lower body 5-10% or 4.5kg max. Upper body 5-10% or 2.3kg max.",1,1,"note","note"]]}
    ]
  }
};

function el(id){return document.getElementById(id)}
function showStatus(text,ok=true){el("status").innerHTML=`<h1>Forge</h1><p class="muted">${ok?"✅":"❌"} ${text}</p>`}
function hideStatus(){setTimeout(()=>el("status").classList.add("hide"),800)}
function isCoach(){return currentProfile?.role==="coach"}
function isCoachEmail(email){return String(email||"").toLowerCase()===PERMANENT_COACH_EMAIL}
function programKey(){return clientState?.program_key||"forge_hybrid"}
function program(){return PROGRAMS[programKey()]||PROGRAMS.forge_hybrid}
function week(){return clientState?.current_week||1}
function phaseIndex(){return Math.min(3,Math.floor((week()-1)/6))}

async function init(){
  try{
    if(!window.STRONG_WEEK_CONFIG) throw new Error("Missing config.js");
    supabaseClient=window.supabase.createClient(window.STRONG_WEEK_CONFIG.supabaseUrl,window.STRONG_WEEK_CONFIG.supabaseAnonKey);
    const {data,error}=await supabaseClient.auth.getSession(); if(error) throw error;
    currentUser=data.session?.user||null;
    if(currentUser){await loadProfile(); await loadClientState(currentProfile.id);}
    showStatus("Forge Cloud ready"); hideStatus(); render();
    supabaseClient.auth.onAuthStateChange(async(e,s)=>{currentUser=s?.user||null;if(currentUser){await loadProfile();await loadClientState(currentProfile.id)}render()});
  }catch(err){console.error(err);showStatus(err.message||String(err),false)}
}

async function getCoachProfile(){const {data}=await supabaseClient.from("profiles").select("*").eq("email",PERMANENT_COACH_EMAIL).maybeSingle();return data}

async function loadProfile(){
  const {data,error}=await supabaseClient.from("profiles").select("*").eq("id",currentUser.id).maybeSingle();
  if(error) console.warn(error);
  if(data){currentProfile=data}else{
    const coach=isCoachEmail(currentUser.email)?null:await getCoachProfile();
    const payload={id:currentUser.id,email:currentUser.email,full_name:currentUser.email,role:isCoachEmail(currentUser.email)?"coach":"client",coach_id:isCoachEmail(currentUser.email)?null:(coach?.id||null)};
    await supabaseClient.from("profiles").insert(payload); currentProfile=payload;
  }
  if(isCoachEmail(currentUser.email)&&currentProfile.role!=="coach"){
    await supabaseClient.from("profiles").update({role:"coach",coach_id:null,email:currentUser.email}).eq("id",currentUser.id);
    currentProfile.role="coach"; currentProfile.coach_id=null;
  }
}

async function loadClientState(clientId){
  const {data}=await supabaseClient.from("client_states").select("*").eq("client_id",clientId).maybeSingle();
  if(data){clientState=data;return data}
  const {data:newState}=await supabaseClient.from("client_states").insert({client_id:clientId,current_week:1,week_locked:false,program_key:"forge_hybrid"}).select().single();
  clientState=newState||{client_id:clientId,current_week:1,week_locked:false,program_key:"forge_hybrid"};return clientState;
}

async function login(){
  try{
    const email=el("loginEmail").value.trim(), password=el("loginPassword").value.trim();
    if(!email||!password) return alert("Enter email and password.");
    const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
    if(error) return alert(error.message);
    currentUser=data.user; await loadProfile(); await loadClientState(currentProfile.id); activeView="today"; render();
  }catch(err){console.error(err);alert("Login error: "+(err.message||err))}
}

async function signup(){
  try{
    const email=el("signupEmail").value.trim(), password=el("signupPassword").value.trim(), name=el("signupName").value.trim();
    const dob=el("signupDob").value, eName=el("signupEmergencyName").value.trim(), ePhone=el("signupEmergencyPhone").value.trim();
    if(!email||!password||!name) return alert("Add name, email and password.");
    if(!isCoachEmail(email)){
      if(!dob||!eName||!ePhone) return alert("Clients must add DOB and emergency contact details.");
      if(name.toLowerCase()===eName.toLowerCase()) return alert("Emergency contact cannot be the same person as client.");
    }
    const coach=isCoachEmail(email)?null:await getCoachProfile();
    const {data,error}=await supabaseClient.auth.signUp({email,password}); if(error) return alert(error.message);
    if(data.user){
      await supabaseClient.from("profiles").insert({id:data.user.id,email,full_name:name,role:isCoachEmail(email)?"coach":"client",coach_id:isCoachEmail(email)?null:(coach?.id||null),date_of_birth:isCoachEmail(email)?null:dob,emergency_contact_name:isCoachEmail(email)?"":eName,emergency_contact_phone:isCoachEmail(email)?"":ePhone});
      await supabaseClient.from("client_states").insert({client_id:data.user.id,current_week:1,week_locked:false,program_key:"forge_hybrid"});
    }
    alert("Account created. Check email if confirmation is required.");
  }catch(err){console.error(err);alert("Signup error: "+(err.message||err))}
}

async function logout(){
  try{await supabaseClient.auth.signOut({scope:"global"})}catch(e){console.warn(e)}
  localStorage.clear();sessionStorage.clear();currentUser=null;currentProfile=null;clientState=null;location.href=location.pathname+"?logout="+Date.now();
}

function render(){
  const logged=!!currentUser;
  el("authView").classList.toggle("hide",logged); el("appView").classList.toggle("hide",!logged); el("topLogout").classList.toggle("hide",!logged);
  if(!logged){el("profileLine").textContent="Forge Cloud";return}
  el("profileLine").textContent=`${currentProfile.full_name||currentUser.email} · ${currentProfile.role}`;
  renderTabs(); renderPhase(); renderToday(); renderProgram(); renderClients(); renderProfile(); renderSettings(); show(activeView,true);
}

function renderTabs(){
  const items=isCoach()?[["today","Today"],["program","Program"],["clients","Clients"],["settings","Settings"]]:[["today","Today"],["program","Program"],["profile","Profile"],["settings","Settings"]];
  el("tabs").innerHTML=items.map(([v,l])=>`<button class="tab ${activeView===v?"active":""}" onclick="show('${v}')">${l}</button>`).join("");
}

function show(v,silent=false){
  if(v==="clients"&&!isCoach()) v="today";
  activeView=v; document.querySelectorAll(".view").forEach(x=>x.classList.add("hide")); el(v)?.classList.remove("hide");
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.textContent.toLowerCase()===v));
  if(!silent) render();
}

function renderPhase(){
  const p=PHASES[phaseIndex()];
  el("phaseBand").innerHTML=`<div class="card banner"><div class="row space"><div><h2>📅 Phase ${phaseIndex()+1} - ${p[0]}</h2><p class="muted">${p[1]} · ${p[2]}</p></div><span class="pill ${clientState?.week_locked?"yellow":"green"}">Week ${week()} ${clientState?.week_locked?"Locked":"Auto"}</span></div></div>`;
}

function todayWorkout(){const d=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date().getDay()];return program().schedule.find(w=>w.schedule===d)||program().schedule[0]}
function workoutCard(w){return `<div class="card"><div class="row space"><div><h2>${w.day}</h2><span class="pill">${w.schedule}</span><span class="pill">${program().name}</span><span class="pill">Week ${week()}</span></div><div class="row"><button class="secondary" onclick="previewWorkout('${esc(w.day)}')">Open</button><button class="green" onclick="preWorkoutCheckin('${esc(w.day)}')">Start</button></div></div></div>`}

function renderToday(){el("today").innerHTML=`<div class="card"><h2>Today</h2><p class="muted">Your assigned program is <b>${program().name}</b>.</p></div>${activeSession?`<div class="card banner"><h2>Workout in progress</h2><p>${activeSession.workout}</p><button class="green" onclick="renderSession()">Resume</button></div>`:workoutCard(todayWorkout())}`}
function renderProgram(){el("program").innerHTML=`<div class="card"><h2>Assigned Program: ${program().name}</h2><p class="muted">${program().description}</p></div>${program().schedule.map(workoutCard).join("")}`}

function esc(s){return String(s).replaceAll("'","\\'")}
function findWorkout(day){return program().schedule.find(x=>x.day===day)}

function previewWorkout(day){
  const w=findWorkout(day);
  el("modalBody").innerHTML=`<h2>${w.day}</h2><p class="muted">${program().name}</p>${w.exercises.map(e=>`<div class="exercise"><b>${e[0]}:</b> ${e[1]} · ${e[2]} x ${e[3]} ${e[4]}</div>`).join("")}`;
  el("modal").classList.add("show");
}

function preWorkoutCheckin(day){
  const w=findWorkout(day);
  el("modalBody").innerHTML=`<h2>Pre-workout check-in</h2><p class="muted">${w.day}</p>
    <label>Energy</label><select id="preEnergy"><option>High energy</option><option>Moderate energy</option><option>Low energy</option></select>
    <label>Sleep</label><select id="preSleep"><option>Very good sleep, full of energy</option><option>Disturbed but good rest</option><option>Disturbed and tired</option><option>Not disturbed but tired</option></select>
    <label>Body comfort before workout</label><select id="preBody"><option>Comfortable and mobile</option><option>A little stiff</option><option>Aches/pains or very stiff</option></select>
    <button class="green full" onclick="startWorkout('${esc(day)}')">Begin workout</button>`;
  el("modal").classList.add("show");
}

function startWorkout(day){
  const w=findWorkout(day);
  activeSession={id:crypto.randomUUID(),start:Date.now(),week:week(),program_key:programKey(),program_name:program().name,workout:w.day,
    pre:{energy:el("preEnergy")?.value||"",sleep:el("preSleep")?.value||"",body:el("preBody")?.value||""},
    exercises:w.exercises.map(e=>({section:e[0],name:e[1],sets:e[2],target:e[3],unit:e[4],type:e[5],comment:"",logs:Array.from({length:e[2]},(_,i)=>({set:i+1,value:"",reps:e[3],done:false}))}))
  };
  closeModal(); renderSession();
}

function renderSession(){
  activeView="today";
  el("today").innerHTML=`<div class="card"><div class="row space"><div><h2>${activeSession.workout}</h2><p class="muted">${activeSession.program_name} · Week ${activeSession.week}</p></div><button class="green" onclick="postWorkoutCheckin()">Finish workout</button></div></div>
  ${activeSession.exercises.map((e,ei)=>`<div class="card"><h3>${e.name}</h3><p class="muted">${e.section} · ${e.sets} x ${e.target} ${e.unit}</p><textarea placeholder="Notes for this exercise" onchange="activeSession.exercises[${ei}].comment=this.value"></textarea>${e.logs.map((l,li)=>`<div class="setrow"><span>${li+1}</span><input placeholder="${label1(e)}" onchange="activeSession.exercises[${ei}].logs[${li}].value=this.value"><input placeholder="${label2(e)}" value="${l.reps}" onchange="activeSession.exercises[${ei}].logs[${li}].reps=this.value"><button onclick="activeSession.exercises[${ei}].logs[${li}].done=!activeSession.exercises[${ei}].logs[${li}].done;this.classList.toggle('done')">✓</button></div>`).join("")}</div>`).join("")}`;
  show("today",true);
}

function label1(e){return e.type==="speed"?"Speed Level":e.type==="incline"?"Incline Level":(e.type==="bodyweight"||e.type==="duration_bodyweight")?"Body Weight":e.type==="duration"?"Duration":e.type==="note"?"Note":"kg"}
function label2(e){return (e.type==="duration"||e.type==="duration_bodyweight")?"min/sec":e.type==="speed"?"Speed/round":e.type==="incline"?"duration":e.type==="note"?"":"reps"}

function postWorkoutCheckin(){
  el("modalBody").innerHTML=`<h2>Post-workout check-in</h2>
    <label>Body comfort after workout</label><select id="postBody"><option>Better than before</option><option>About the same</option><option>Worse than before</option></select>
    <label>Workout difficulty</label><select id="postDifficulty"><option>Had plenty left</option><option>Just right</option><option>I am buggered</option></select>
    <button class="green full" onclick="finishWorkout()">Save workout</button>`;
  el("modal").classList.add("show");
}

async function finishWorkout(){
  const duration=Math.round((Date.now()-activeSession.start)/60000)||1;
  const {data:s,error}=await supabaseClient.from("workout_sessions").insert({client_id:currentProfile.id,coach_id:currentProfile.coach_id,week:activeSession.week,program_key:activeSession.program_key,workout_name:activeSession.workout,duration_minutes:duration}).select().single();
  if(error) return alert(error.message);
  const rows=activeSession.exercises.flatMap(e=>e.logs.map(l=>({session_id:s.id,client_id:currentProfile.id,exercise:e.name,exercise_type:e.type,week:activeSession.week,set_number:l.set,metric_value:Number(l.value)||0,reps_or_duration:Number(l.reps)||0,unit:e.unit,comment:e.comment||""})));
  await supabaseClient.from("exercise_logs").insert(rows);
  await supabaseClient.from("recovery_logs").insert({session_id:s.id,client_id:currentProfile.id,week:activeSession.week,pre_energy:activeSession.pre.energy,pre_sleep:activeSession.pre.sleep,pre_body_comfort:activeSession.pre.body,post_body_comfort:el("postBody").value,workout_difficulty:el("postDifficulty").value});
  await maybeProgressWeek(currentProfile.id);
  activeSession=null; closeModal(); alert("Workout saved."); await loadClientState(currentProfile.id); activeView=isCoach()?"clients":"profile"; render();
}

async function maybeProgressWeek(clientId){
  const st=await loadClientState(clientId); if(st.week_locked) return;
  const {count}=await supabaseClient.from("workout_sessions").select("*",{count:"exact",head:true}).eq("client_id",clientId).eq("week",st.current_week);
  if((count||0)>=3) await supabaseClient.from("client_states").update({current_week:st.current_week+1}).eq("client_id",clientId);
}

async function renderClients(){
  if(!isCoach()){el("clients").innerHTML="";return}

  const {data:clients=[],error}=await supabaseClient
    .from("profiles")
    .select("*")
    .eq("coach_id",currentProfile.id)
    .order("full_name",{ascending:true});

  if(error){
    el("clients").innerHTML=`<div class="card"><h2>Clients</h2><p>${error.message}</p></div>`;
    return;
  }

  const {data:states=[]}=await supabaseClient.from("client_states").select("*");
  const stateFor = id => states.find(s=>s.client_id===id) || {};

  el("clients").innerHTML=`
    <div class="card">
      <h2>Clients</h2>
      <p class="muted">Open a client profile to manage details, program assignment, progress, charts, recovery alerts, workout modification requests, and coach comments.</p>
    </div>
    ${clients.map(c=>{
      const st=stateFor(c.id);
      const pName=PROGRAMS[st.program_key||"forge_hybrid"]?.name || "Forge Hybrid 3-Day";
      return `
        <div class="card">
          <div class="row space">
            <div>
              <h2>${c.full_name||c.email}</h2>
              <p class="muted">${c.email}</p>
              <span class="pill">${pName}</span>
              <span class="pill">Week ${st.current_week||1}</span>
              <span class="pill ${st.week_locked?"yellow":"green"}">${st.week_locked?"Locked":"Auto progression"}</span>
            </div>
            <button class="green" onclick="openClient('${c.id}','details')">Open profile</button>
          </div>
        </div>
      `;
    }).join("") || "<div class='card'>No clients yet.</div>"}
  `;
}

async function openClient(id,section="details"){
  const {data:p,error}=await supabaseClient.from("profiles").select("*").eq("id",id).single();
  if(error)return alert(error.message);

  const st=await loadClientState(id);
  const {data:mods=[]}=await supabaseClient.from("modification_requests").select("*").eq("client_id",id).order("created_at",{ascending:false});
  const {data:sessions=[]}=await supabaseClient.from("workout_sessions").select("*").eq("client_id",id).order("created_at",{ascending:false});
  const {data:recovery=[]}=await supabaseClient.from("recovery_logs").select("*").eq("client_id",id).order("created_at",{ascending:false});
  const {data:comments=[]}=await supabaseClient.from("coach_comments").select("*").eq("client_id",id).order("created_at",{ascending:false});

  const pKey=st.program_key||"forge_hybrid";
  const pName=PROGRAMS[pKey]?.name||"Forge Hybrid 3-Day";
  const lastSession=sessions[0];
  const redFlags=recovery
    .filter(r=>r.pre_energy==="Low energy" || r.pre_body_comfort==="Aches/pains or very stiff" || r.post_body_comfort==="Worse than before" || r.workout_difficulty==="I am buggered")
    .slice(0,6);

  const nav=`
    <div class="miniTabs">
      <button class="miniTab ${section==="details"?"active":""}" onclick="openClient('${id}','details')">Client Details</button>
      <button class="miniTab ${section==="assignment"?"active":""}" onclick="openClient('${id}','assignment')">Program Assignment</button>
      <button class="miniTab ${section==="progress"?"active":""}" onclick="openClient('${id}','progress')">Progress</button>
      <button class="miniTab ${section==="charts"?"active":""}" onclick="openClient('${id}','charts')">Charts</button>
      <button class="miniTab ${section==="alerts"?"active":""}" onclick="openClient('${id}','alerts')">Recovery / Pain</button>
      <button class="miniTab ${section==="requests"?"active":""}" onclick="openClient('${id}','requests')">Modification Requests</button>
      <button class="miniTab ${section==="comments"?"active":""}" onclick="openClient('${id}','comments')">Coach Comments</button>
    </div>`;

  let body="";

  if(section==="details"){
    body=`
      <div class="grid">
        <div class="card">
          <h3>Client Details</h3>
          <p><b>Name:</b> ${p.full_name||"Not added"}</p>
          <p><b>Email:</b> ${p.email||"Not added"}</p>
          <p><b>DOB:</b> ${p.date_of_birth||"Not added"}</p>
          <p><b>Emergency:</b> ${p.emergency_contact_name||"Not added"} ${p.emergency_contact_phone||""}</p>
        </div>
        <div class="card">
          <h3>Current Training State</h3>
          <p><b>Program:</b> ${pName}</p>
          <p><b>Current week:</b> ${st.current_week||1}</p>
          <p><b>Progression:</b> ${st.week_locked?"Locked by coach":"Auto progression"}</p>
          <p><b>Last workout:</b> ${lastSession?lastSession.workout_name:"No workout yet"}</p>
        </div>
      </div>`;
  }

  if(section==="assignment"){
    body=`
      <div class="card">
        <h3>Program Assignment</h3>
        <p class="muted">Assign a program, start from any week, or lock/unlock progression.</p>
        <label>Program</label>
        <select id="clientProgram">
          <option value="forge_hybrid" ${pKey==="forge_hybrid"?"selected":""}>Forge Hybrid 3-Day</option>
          <option value="metabolic_21" ${pKey==="metabolic_21"?"selected":""}>21-Day Metabolic Reset</option>
          <option value="stronglifts_5x5" ${pKey==="stronglifts_5x5"?"selected":""}>StrongLifts 5×5</option>
        </select>
        <label>Current/start week</label>
        <input id="clientWeek" type="number" min="1" max="24" value="${st.current_week||1}">
        <label>Progression</label>
        <select id="clientLock">
          <option value="false" ${!st.week_locked?"selected":""}>Auto progress after 3 workouts</option>
          <option value="true" ${st.week_locked?"selected":""}>Locked by coach</option>
        </select>
        <button class="green full" onclick="saveClientAssignment('${id}')">Save assignment</button>
      </div>`;
  }

  if(section==="progress"){
    body=`
      <div class="grid">
        <div class="card"><h3>Completed Workouts</h3><h1>${sessions.length}</h1><p class="muted">Total logged sessions</p></div>
        <div class="card"><h3>Current Week</h3><h1>${st.current_week||1}</h1><p class="muted">${pName}</p></div>
        <div class="card"><h3>Last Workout Duration</h3><h1>${lastSession?.duration_minutes||0} min</h1><p class="muted">${lastSession?.workout_name||"No workout yet"}</p></div>
      </div>
      <div class="card"><h3>Workout History</h3>${sessions.map(s=>`<div class="exercise"><b>${s.workout_name}</b><p class="muted">Week ${s.week} · ${s.duration_minutes} min · ${new Date(s.created_at).toLocaleString()}</p></div>`).join("")||"<p class='muted'>No workouts yet.</p>"}</div>`;
  }

  if(section==="charts"){
    body=`<div class="card"><h3>Charts</h3><p class="muted">Strength, speed, duration and recovery changes over time.</p></div><div id="clientChartsHost"></div>`;
  }

  if(section==="alerts"){
    body=`
      <div class="card"><h3>Recovery / Pain Alerts</h3><p class="muted">Flags appear when energy is low, body comfort is poor, post-workout comfort worsens, or the workout was too hard.</p></div>
      ${redFlags.map(r=>`<div class="alertBox redFlag"><b>Alert</b><p>Energy: ${r.pre_energy||"N/A"} · Before: ${r.pre_body_comfort||"N/A"} · After: ${r.post_body_comfort||"N/A"} · Difficulty: ${r.workout_difficulty||"N/A"}</p><p class="muted">${new Date(r.created_at).toLocaleString()}</p></div>`).join("")||"<div class='card'><p class='muted'>No recovery or pain alerts yet.</p></div>"}
      <div class="card"><h3>Recent Recovery Logs</h3>${recovery.slice(0,8).map(r=>`<div class="exercise"><b>${r.pre_energy||"Energy not recorded"}</b><p class="muted">Sleep: ${r.pre_sleep||"N/A"} · Before: ${r.pre_body_comfort||"N/A"} · After: ${r.post_body_comfort||"N/A"} · Difficulty: ${r.workout_difficulty||"N/A"}</p></div>`).join("")||"<p class='muted'>No recovery logs yet.</p>"}</div>`;
  }

  if(section==="requests"){
    body=`
      <div class="card"><h3>Workout Modification Requests</h3><p class="muted">Client requests for pain, discomfort, equipment limitations, or exercise changes.</p></div>
      ${mods.map(m=>`<div class="exercise"><div class="row space"><b>${m.status||"open"}</b><span class="pill">${new Date(m.created_at).toLocaleString()}</span></div><p>${m.request_text}</p><button class="secondary" onclick="markRequestResolved(${m.id},'${id}')">Mark resolved</button></div>`).join("")||"<div class='card'><p class='muted'>No workout modification requests yet.</p></div>"}`;
  }

  if(section==="comments"){
    body=`
      <div class="card">
        <h3>Coach Exercise Comment</h3>
        <input id="commentExercise" placeholder="Exercise name">
        <textarea id="commentText" placeholder="Comment/cue"></textarea>
        <button class="green full" onclick="saveCoachComment('${id}')">Save comment</button>
      </div>
      <div class="card"><h3>Previous Comments</h3>${comments.map(c=>`<div class="exercise"><b>${c.exercise||"General"}</b><p>${c.comment||""}</p><p class="muted">${new Date(c.created_at).toLocaleString()}</p></div>`).join("")||"<p class='muted'>No comments yet.</p>"}</div>`;
  }

  el("modalBody").innerHTML=`<div class="card banner"><h2>${p.full_name||p.email}</h2><p class="muted">${p.email}</p><span class="pill">${pName}</span><span class="pill ${st.week_locked?"yellow":"green"}">Week ${st.current_week||1} ${st.week_locked?"Locked":"Auto"}</span></div>${nav}${body}`;
  el("modal").classList.add("show");

  if(section==="charts"){ await renderChartsOnly(id); }
}

async function markRequestResolved(requestId, clientId){
  const {error}=await supabaseClient.from("modification_requests").update({status:"resolved"}).eq("id",requestId);
  if(error)return alert(error.message);
  openClient(clientId,"requests");
}

async function renderChartsOnly(id){
  const {data:logs=[]}=await supabaseClient.from("exercise_logs").select("*").eq("client_id",id);
  const {data:recovery=[]}=await supabaseClient.from("recovery_logs").select("*").eq("client_id",id).order("created_at",{ascending:true});
  el("clientChartsHost").innerHTML=`<div class="grid"><div class="card"><h3>Kg / week</h3><canvas id="kgChart"></canvas></div><div class="card"><h3>Speed / week</h3><canvas id="speedChart"></canvas></div><div class="card"><h3>Duration / week</h3><canvas id="durationChart"></canvas></div><div class="card"><h3>Recovery before/after</h3><canvas id="recoveryChart"></canvas></div></div>`;
  setTimeout(()=>drawAllCharts(logs,recovery),80);
}

async function saveClientAssignment(id){
  const {error}=await supabaseClient.from("client_states").upsert({client_id:id,program_key:el("clientProgram").value,current_week:Number(el("clientWeek").value),week_locked:el("clientLock").value==="true"});
  if(error)return alert(error.message); alert("Assignment saved."); closeModal(); renderClients();
}

async function saveCoachComment(id){
  const {error}=await supabaseClient.from("coach_comments").insert({client_id:id,coach_id:currentProfile.id,exercise:el("commentExercise").value,comment:el("commentText").value});
  if(error)return alert(error.message); alert("Comment saved."); openClient(id,"comments");
}

async function openClientProgress(id){closeModal();await renderProgressIntoProfile(id,true)}

async function renderProgressIntoProfile(id=currentProfile.id,asModal=false){
  const {data:sessions=[]}=await supabaseClient.from("workout_sessions").select("*").eq("client_id",id).order("created_at",{ascending:false});
  const {data:logs=[]}=await supabaseClient.from("exercise_logs").select("*").eq("client_id",id);
  const {data:recovery=[]}=await supabaseClient.from("recovery_logs").select("*").eq("client_id",id).order("created_at",{ascending:true});
  const html=`<div class="card"><h2>Progress + Charts</h2><p class="muted">${sessions.length} completed workouts.</p></div><div class="grid"><div class="card"><h3>Kg / week</h3><canvas id="kgChart"></canvas></div><div class="card"><h3>Speed / week</h3><canvas id="speedChart"></canvas></div><div class="card"><h3>Duration / week</h3><canvas id="durationChart"></canvas></div><div class="card"><h3>Recovery before/after</h3><canvas id="recoveryChart"></canvas></div></div><div class="card"><h3>Workout history</h3>${sessions.map(s=>`<div class="exercise"><b>${s.workout_name}</b><p class="muted">Week ${s.week} · ${s.duration_minutes} min · ${new Date(s.created_at).toLocaleString()}</p></div>`).join("")||"<p class='muted'>No workouts yet.</p>"}</div>`;
  if(asModal){el("modalBody").innerHTML=html;el("modal").classList.add("show")}else{el("profile").innerHTML+=html}
  setTimeout(()=>drawAllCharts(logs,recovery),80);
}

function renderProfile(){
  if(isCoach()){el("profile").innerHTML="";return}
  el("profile").innerHTML=`<div class="card"><h2>Profile</h2><p class="muted">${currentProfile.email}</p><p><b>Program:</b> ${program().name}</p><p><b>Current week:</b> ${week()}</p></div><div class="card"><h3>Workout Modification Request</h3><p class="muted">Use this for pain/discomfort, equipment limitations, or exercise changes.</p><textarea id="modRequestText" placeholder="What would you like changed?"></textarea><button class="green full" onclick="submitModificationRequest()">Submit request</button></div>`;
  renderProgressIntoProfile(currentProfile.id,false);
}

async function submitModificationRequest(){
  const txt=el("modRequestText").value.trim(); if(!txt)return alert("Write your request first.");
  const {error}=await supabaseClient.from("modification_requests").insert({client_id:currentProfile.id,coach_id:currentProfile.coach_id,request_text:txt,status:"open"});
  if(error)return alert(error.message); alert("Request submitted."); el("modRequestText").value="";
}

function drawAllCharts(logs,recovery){drawChart("kgChart",group(logs,"main","metric_value"));drawChart("speedChart",group(logs,"speed","metric_value"));drawChart("durationChart",group(logs,"duration_bodyweight","reps_or_duration"));drawChart("recoveryChart",recoveryValues(recovery))}
function group(logs,type,field){const m={};logs.filter(x=>x.exercise_type===type).forEach(x=>m[x.week]=Math.max(m[x.week]||0,Number(x[field])||0));return m}
function recoveryValues(rows){const m={};rows.forEach((r,i)=>{m[i+1]=scoreRecovery(r)});return m}
function scoreRecovery(r){let s=0;s+=r.pre_energy==="High energy"?3:r.pre_energy==="Moderate energy"?2:1;s+=r.pre_body_comfort==="Comfortable and mobile"?3:r.pre_body_comfort==="A little stiff"?2:1;s+=r.post_body_comfort==="Better than before"?3:r.post_body_comfort==="About the same"?2:1;return s}
function drawChart(id,data){const c=el(id);if(!c)return;const ctx=c.getContext("2d");c.width=c.clientWidth*2;c.height=240*2;ctx.scale(2,2);ctx.clearRect(0,0,c.width,c.height);const keys=Object.keys(data),vals=keys.map(k=>data[k]),max=Math.max(1,...vals);ctx.strokeStyle="#60a5fa";ctx.lineWidth=3;ctx.beginPath();keys.forEach((k,i)=>{const x=30+i*((c.clientWidth-60)/Math.max(1,keys.length-1)),y=200-(vals[i]/max)*150;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);ctx.fillStyle="#94a3b8";ctx.fillText("W"+k,x-8,222);ctx.fillText(String(vals[i]),x-8,y-8)});ctx.stroke()}

function renderSettings(){el("settings").innerHTML=`<div class="card"><h2>Settings</h2><p class="muted">${currentProfile.email} · ${currentProfile.role}</p><button class="red full" onclick="logout()">Force log out</button></div>`}
function closeModal(){el("modal").classList.remove("show")}
init();
</script>
</body>
</html>
