<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forge</title>
  <meta name="theme-color" content="#020817" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    :root{--bg:#020817;--card:#0f172a;--line:#26344d;--text:#f8fafc;--muted:#94a3b8;--green:#34d399;--blue:#60a5fa}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at top,#172554,#020817 55%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
    header{background:rgba(2,8,23,.9);border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:9}
    .top{max-width:1120px;margin:auto;padding:14px;display:flex;gap:12px;align-items:center}
    .logo{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#60a5fa,#8b5cf6);display:grid;place-items:center;font-weight:900}
    h1,h2,h3{margin:0 0 10px}.sub,.muted{color:var(--muted)}
    main{max-width:1120px;margin:auto;padding:16px}
    .card{background:linear-gradient(180deg,rgba(15,23,42,.96),rgba(17,24,39,.96));border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
    .banner{background:linear-gradient(135deg,#1e3a8a,#312e81)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
    input,select,textarea{width:100%;background:#07111f;border:1px solid var(--line);border-radius:14px;padding:13px;color:var(--text);font:inherit;margin-bottom:8px}
    button{border:0;border-radius:14px;padding:12px 15px;font-weight:800;cursor:pointer;background:var(--blue);color:#06101f}
    .green{background:var(--green)}.secondary{background:#1f2937;color:white;border:1px solid var(--line)}.full{width:100%}
    .tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
    .tab{background:#111827;color:var(--muted);border:1px solid var(--line)}.tab.active{background:white;color:#020817}
    .hide{display:none!important}.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--muted);font-size:12px;margin:3px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.small{font-size:12px}
    .exercise{border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;background:#08111f}
    .setrow{display:grid;grid-template-columns:40px 1fr 1fr 50px;gap:8px;margin:8px 0;align-items:center}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;z-index:40}.modal.show{display:flex}
    .sheet{width:100%;max-width:850px;margin:0 auto;background:#0f172a;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:16px;max-height:85vh;overflow:auto}
    @media(max-width:760px){.tabs{grid-template-columns:repeat(3,1fr)}.setrow{grid-template-columns:32px 1fr 1fr 42px}}
  </style>
</head>
<body>
<header><div class="top"><div class="logo">F</div><div><h2>Move With Intent</h2><div class="sub" id="profileLine">Forge Cloud</div></div></div></header>
<main>
  <div id="status" class="card banner"><h1>Forge</h1><p class="muted">Syncing Forge Cloud...</p></div>

  <section id="authView">
    <div class="grid">
      <div class="card">
        <h2>Log in</h2>
        <input id="loginEmail" placeholder="Email" autocomplete="email">
        <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
        <button id="loginBtn" class="green full" type="button" onclick="login()">Log in</button>
      </div>
      <div class="card">
        <h2>Create account</h2>
        <input id="signupName" placeholder="Full name">
        <input id="signupEmail" placeholder="Email">
        <input id="signupPassword" type="password" placeholder="Password">
        <input id="signupDob" type="date" placeholder="Date of birth">
        <input id="signupEmergencyName" placeholder="Emergency contact name">
        <input id="signupEmergencyPhone" placeholder="Emergency contact phone">
        <button id="signupBtn" class="green full" type="button" onclick="signup()">Create account</button>
        <p class="muted small">Client accounts are automatically assigned to Marcell as coach.</p>
      </div>
    </div>
  </section>

  <section id="appView" class="hide">
    <div id="tabs" class="tabs"></div>
    <div id="phaseBand"></div>
    <div id="today" class="view"></div>
    <div id="program" class="view hide"></div>
    <div id="progress" class="view hide"></div>
    <div id="clients" class="view hide"></div>
    <div id="requests" class="view hide"></div>
    <div id="settings" class="view hide"></div>
  </section>
</main>

<div id="modal" class="modal"><div class="sheet"><div id="modalBody"></div><button class="secondary full" onclick="closeModal()">Close</button></div></div>

<script>
const PERMANENT_COACH_EMAIL = "marcell.fitness@gmail.com";
const LS = "forge_app_v1";

let supabaseClient = null;
let currentUser = null;
let currentProfile = null;
let activeView = "today";
let activeSession = null;

function el(id){ return document.getElementById(id); }
function setStatus(text, ok=true){ el("status").innerHTML = `<h1>Forge</h1><p class="muted">${ok ? "✅ " : "❌ "}${text}</p>`; }
function hideStatus(){ setTimeout(()=>el("status").classList.add("hide"), 900); }
function isCoachEmail(email){ return String(email||"").toLowerCase() === PERMANENT_COACH_EMAIL.toLowerCase(); }
function localKey(){ return `${LS}_${currentUser?.id || "guest"}`; }
function getStore(){ return JSON.parse(localStorage.getItem(localKey()) || '{"week":1,"sessions":[],"requests":[]}'); }
function setStore(v){ localStorage.setItem(localKey(), JSON.stringify(v)); }
function saveActive(){ if(activeSession) localStorage.setItem(localKey()+"_active", JSON.stringify(activeSession)); }
function loadActive(){ activeSession = JSON.parse(localStorage.getItem(localKey()+"_active") || "null"); }
function clearActive(){ localStorage.removeItem(localKey()+"_active"); }

const PHASES=[
  {name:"Foundation",weeks:"Weeks 1-6",focus:["Technique","Control","Build base conditioning"],how:["Main lifts: 5 x 5 moderate weight","Leave 2-3 reps in reserve","Conditioning: steady pace"],goal:["Feel confident, not destroyed","Build consistency"]},
  {name:"Strength Build",weeks:"Weeks 7-12",focus:["Progressive overload","Strength increase"],how:["Add 2.5-5 kg weekly to main lifts","Push closer to failure","Conditioning slightly harder"],goal:["Noticeable strength gains","Muscles starting to show more"]},
  {name:"Intensification",weeks:"Weeks 13-18",focus:["Heavier weights","More intensity","Power output"],how:["Main lifts: 4 x 4 heavier","Last set hard but clean","Drive and speed"],goal:["Feel powerful","Performance jump"]},
  {name:"Performance + Athletic Look",weeks:"Weeks 19-24",focus:["Strength + conditioning","Lean athletic physique"],how:["Heavy but clean sets","Slightly reduce rest","Sharper conditioning"],goal:["Look and feel athletic","Strong and conditioned"]}
];

const PROGRAM=[
  {day:"Day 1 - Lower Body Strength + Engine",schedule:"Monday",exercises:[
    ["Warm-Up","Incline treadmill walk",1,5,"min","incline"],["Warm-Up","Bodyweight squats",1,15,"reps","bodyweight"],["Warm-Up","Lunges",1,10,"each leg","bodyweight"],
    ["Main Lift","Barbell Squat",5,5,"reps","main"],["Secondary","Romanian Deadlift",3,8,"reps","other"],["Secondary","Leg Press",3,10,"reps","other"],
    ["Functional","Walking Lunges (DB)",3,10,"each leg","other"],["Functional","Leg Curl",3,12,"reps","other"],["Conditioning","Incline treadmill walk, steady moderate effort",1,12,"min","incline"],["Finisher / Cool Down","Plank",2,60,"seconds","duration_bodyweight"]
  ]},
  {day:"Day 2 - Upper Body Strength + Work Capacity",schedule:"Wednesday",exercises:[
    ["Warm-Up","Row machine",1,5,"min","duration"],["Warm-Up","Band pull-aparts",1,15,"reps","bodyweight"],["Main Lift","Bench Press",5,5,"reps","main"],
    ["Secondary","Lat Pulldown or Pull-ups",3,10,"reps","other"],["Secondary","Seated Row",3,10,"reps","other"],["Functional","Dumbbell Shoulder Press",3,10,"reps","other"],
    ["Functional","Triceps Pushdown",3,12,"reps","other"],["Conditioning","Bike steady pace, heart rate in green zone",1,12,"min","duration"]
  ]},
  {day:"Day 3 - Full Body Strength + Conditioning",schedule:"Friday",exercises:[
    ["Warm-Up","Row machine",1,5,"min","duration"],["Warm-Up","Dynamic hip mobility",1,1,"min each leg","duration"],["Main Lift","Deadlift",5,5,"reps","main"],
    ["Power","Push Press",3,6,"reps","other"],["Power","Step-Ups",3,8,"reps","other"],["Functional","Walking Lunges",3,10,"each leg","bodyweight"],
    ["Functional","Cable Woodchoppers",3,12,"each side","other"],["Conditioning","Treadmill intervals, 1 min run / 1 min walk",8,1,"round","speed"],["Finisher / Cool Down","Push-ups",2,12,"reps","bodyweight"],["Finisher / Cool Down","Plank",1,60,"seconds","duration_bodyweight"]
  ]}
];

async function init(){
  try{
    if(!window.STRONG_WEEK_CONFIG) throw new Error("Missing config.js values.");
    supabaseClient = window.supabase.createClient(window.STRONG_WEEK_CONFIG.supabaseUrl, window.STRONG_WEEK_CONFIG.supabaseAnonKey);

    console.log("Forge buttons ready");

    const { data, error } = await supabaseClient.auth.getSession();
    if(error) throw error;
    currentUser = data.session?.user || null;
    if(currentUser){ await loadProfile(); loadActive(); }
    setStatus("Forge Cloud ready.");
    hideStatus();
    render();
  }catch(err){
    console.error(err);
    setStatus(err.message || String(err), false);
    el("authView").classList.remove("hide");
  }
}

supabaseClient?.auth?.onAuthStateChange?.(()=>{});

async function setupAuthListener(){
  if(!supabaseClient) return;
  supabaseClient.auth.onAuthStateChange(async (event, session)=>{
    try{
      console.log("Auth state changed:", event);
      currentUser = session?.user || currentUser || null;
      if(currentUser){
        await loadProfile();
        loadActive();
        activeView = activeView || "today";
      }
      render();
    }catch(err){
      console.error("Auth profile error", err);
      alert("Login worked, but profile loading failed: " + (err.message || err));
    }
  });
}

async function getCoachProfile(){
  const { data } = await supabaseClient.from("profiles").select("*").eq("email", PERMANENT_COACH_EMAIL).maybeSingle();
  return data;
}

async function loadProfile(){
  const { data, error } = await supabaseClient.from("profiles").select("*").eq("id", currentUser.id).maybeSingle();
  if(error) console.warn(error);
  if(data){
    currentProfile = data;
  }else{
    const isCoach = isCoachEmail(currentUser.email);
    const coach = isCoach ? null : await getCoachProfile();
    const payload={id:currentUser.id,email:currentUser.email,full_name:currentUser.email,role:isCoach?"coach":"client",coach_id:isCoach?null:(coach?.id||null),date_of_birth:null,emergency_contact_name:"",emergency_contact_phone:""};
    const { data:newP, error:insertError } = await supabaseClient.from("profiles").insert(payload).select().single();
    if(insertError) console.warn(insertError);
    currentProfile = newP || payload;
  }
  if(isCoachEmail(currentUser.email) && currentProfile.role !== "coach"){
    await supabaseClient.from("profiles").update({role:"coach",email:currentUser.email,coach_id:null}).eq("id",currentUser.id);
    currentProfile.role="coach"; currentProfile.coach_id=null; currentProfile.email=currentUser.email;
  }
}

async function login(){
  try{
    console.log("Login button pressed");

    const email=el("loginEmail").value.trim();
    const password=el("loginPassword").value.trim();

    if(!email || !password){
      alert("Please enter email and password.");
      return;
    }

    el("loginBtn").textContent = "Logging in...";

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if(error){
      el("loginBtn").textContent = "Log in";
      alert(error.message);
      return;
    }

    currentUser = data.user;

    if(!currentUser){
      const sessionResult = await supabaseClient.auth.getSession();
      currentUser = sessionResult.data.session?.user || null;
    }

    if(!currentUser){
      el("loginBtn").textContent = "Log in";
      alert("Login succeeded, but no user session was returned. Please refresh and try again.");
      return;
    }

    await loadProfile();
    loadActive();

    el("loginBtn").textContent = "Log in";
    setStatus("Forge Cloud connected.");
    hideStatus();

    activeView = "today";
    render();

  }catch(err){
    el("loginBtn").textContent = "Log in";
    console.error("Login error:", err);
    alert("Login error: " + (err.message || err));
  }
}

async function signup(){
  try{
    console.log("Create account button pressed");
    const email=el("signupEmail").value.trim(), password=el("signupPassword").value.trim(), name=el("signupName").value.trim();
    const dob=el("signupDob").value||null, eName=el("signupEmergencyName").value.trim(), ePhone=el("signupEmergencyPhone").value.trim();
    const isCoach=isCoachEmail(email);
    if(!email || !password || !name) return alert("Add name, email and password.");
    if(!isCoach){
      if(!dob || !eName || !ePhone) return alert("Clients must add date of birth, emergency contact name, and emergency contact phone.");
      if(name.toLowerCase() === eName.toLowerCase()) return alert("Emergency contact cannot be the same person as the client.");
    }
    const coach = isCoach ? null : await getCoachProfile();
    const { data, error } = await supabaseClient.auth.signUp({email,password});
    if(error) return alert(error.message);
    if(data.user){
      const payload={id:data.user.id,email,full_name:name,role:isCoach?"coach":"client",coach_id:isCoach?null:(coach?.id||null),date_of_birth:isCoach?null:dob,emergency_contact_name:isCoach?"":eName,emergency_contact_phone:isCoach?"":ePhone};
      const { error:pError } = await supabaseClient.from("profiles").insert(payload);
      if(pError) return alert("Account created, but profile insert needs policy check: " + pError.message);
    }
    alert(isCoach ? "Coach account created. Log in." : "Client account created and assigned to Marcell. Check email if confirmation is required.");
  }catch(err){ console.error(err); alert("Signup error: " + (err.message||err)); }
}

function clientComplete(){ return currentProfile?.role !== "client" || !!(currentProfile.date_of_birth && currentProfile.emergency_contact_name && currentProfile.emergency_contact_phone); }

function render(){
  const logged=!!currentUser;
  el("authView").classList.toggle("hide", logged);
  el("appView").classList.toggle("hide", !logged);
  if(!logged){ el("profileLine").textContent="Forge Cloud"; return; }
  el("profileLine").textContent=`${currentProfile.full_name || currentUser.email} · ${currentProfile.role}`;
  renderTabs(); renderPhase(); renderToday(); renderProgram(); renderProgress(); renderClients(); renderRequests(); renderSettings();
  show(activeView, true);
}

function renderTabs(){
  const items=currentProfile.role==="coach" ? [["today","Today"],["program","Program"],["progress","Progress"],["clients","Clients"],["requests","Requests"],["settings","Settings"]] : [["today","Today"],["program","Program"],["progress","Progress"],["requests","Requests"],["settings","Settings"]];
  el("tabs").innerHTML=items.map(([v,l])=>`<button class="tab ${activeView===v?"active":""}" onclick="show('${v}')">${l}</button>`).join("");
}

function show(view, silent=false){
  if(view==="clients" && currentProfile?.role!=="coach") view="today";
  if(currentProfile?.role==="client" && !clientComplete() && view!=="settings") view="settings";
  activeView=view;
  document.querySelectorAll(".view").forEach(x=>x.classList.add("hide"));
  const target=el(view); if(target) target.classList.remove("hide");
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.textContent.toLowerCase()===view));
  if(!silent) render();
}

function week(){ return getStore().week||1; }
function phase(){ return PHASES[Math.min(3, Math.floor((week()-1)/6))]; }
function renderPhase(){
  const p=phase();
  el("phaseBand").innerHTML=`<div class="card banner"><div class="row space"><div><h2>📅 Phase ${Math.floor((week()-1)/6)+1} - ${p.name}</h2><p class="muted">${p.weeks}</p></div><span class="pill">Week ${week()}</span></div><div class="grid"><div><b>Focus</b>${p.focus.map(x=>`<p class="small muted">• ${x}</p>`).join("")}</div><div><b>How to train</b>${p.how.map(x=>`<p class="small muted">• ${x}</p>`).join("")}</div><div><b>Goal</b>${p.goal.map(x=>`<p class="small muted">👉 ${x}</p>`).join("")}</div></div></div>`;
}
function todayWorkout(){ const d=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date().getDay()]; return PROGRAM.find(w=>w.schedule===d)||PROGRAM[0]; }
function workoutCard(w){ return `<div class="card"><div class="row space"><div><h2>${w.day}</h2><span class="pill">${w.schedule}</span><span class="pill">Week ${week()}</span></div><div class="row"><button class="secondary" onclick="previewWorkout('${w.day}')">Open</button><button class="green" onclick="startWorkout('${w.day}')">Start</button></div></div>${[...new Set(w.exercises.map(e=>e[0]))].map(s=>`<span class="pill">${s}</span>`).join("")}</div>`; }
function renderToday(){ el("today").innerHTML=`<div class="card"><h2>Today</h2><p class="muted">Main lifts rest 90 sec. Others rest 60 sec. Move with intent.</p></div>${activeSession?`<div class="card banner"><h2>Workout in progress</h2><p>${activeSession.workout}</p><button class="green" onclick="renderSession()">Resume workout</button></div>`:workoutCard(todayWorkout())}`; }
function renderProgram(){ el("program").innerHTML=`<div class="card"><h2>Program</h2><p class="muted">Open to preview the whole workout or Start to log it.</p></div>${PROGRAM.map(workoutCard).join("")}`; }
function renderProgress(){ const s=getStore().sessions; el("progress").innerHTML=`<div class="card"><h2>Progress</h2><p class="muted">${s.length} workouts saved on this device.</p>${s.slice().reverse().map(x=>`<div class="exercise"><b>${x.workout}</b><p class="small muted">${new Date(x.date).toLocaleString()}</p></div>`).join("")}</div>`; }
async function renderClients(){
  if(currentProfile?.role!=="coach"){ el("clients").innerHTML=""; return; }
  const {data,error}=await supabaseClient.from("profiles").select("*").eq("coach_id",currentProfile.id).order("full_name",{ascending:true});
  el("clients").innerHTML=`<div class="card"><h2>Clients</h2><p class="muted">New clients are automatically assigned to you.</p></div>${error?`<div class="card">Could not load clients: ${error.message}</div>`:(data||[]).map(c=>`<div class="card"><h2>${c.full_name||c.email}</h2><p class="muted">${c.email||""}</p><p>DOB: ${c.date_of_birth||"Not added"}</p><p>Emergency: ${c.emergency_contact_name||"Not added"} ${c.emergency_contact_phone||""}</p></div>`).join("") || "<div class='card'>No clients yet.</div>"}`;
}
function renderRequests(){ el("requests").innerHTML=`<div class="card"><h2>Requests</h2><p class="muted">Substitution requests will appear here.</p></div>`; }
function renderSettings(){
  el("settings").innerHTML=`<div class="card"><h2>Settings</h2><p class="muted">${currentUser.email} · ${currentProfile.role}</p><label class="small muted">Full name</label><input id="settingsName" value="${currentProfile.full_name||""}"><label class="small muted">Date of birth</label><input id="settingsDob" type="date" value="${currentProfile.date_of_birth||""}"><label class="small muted">Emergency contact name</label><input id="settingsEmergencyName" value="${currentProfile.emergency_contact_name||""}"><label class="small muted">Emergency contact phone</label><input id="settingsEmergencyPhone" value="${currentProfile.emergency_contact_phone||""}"><button class="green full" onclick="updateProfile()">Save profile details</button><br><br><button class="secondary" onclick="logout()">Log out</button></div>`;
}
async function updateProfile(){
  const payload={full_name:el("settingsName").value.trim(),date_of_birth:el("settingsDob").value||null,emergency_contact_name:el("settingsEmergencyName").value.trim(),emergency_contact_phone:el("settingsEmergencyPhone").value.trim()};
  if(currentProfile.role==="client"){
    if(!payload.date_of_birth||!payload.emergency_contact_name||!payload.emergency_contact_phone) return alert("Clients must keep date of birth and emergency contact details completed.");
    if(payload.full_name.toLowerCase()===payload.emergency_contact_name.toLowerCase()) return alert("Emergency contact cannot be the same as the client.");
  }
  const {data,error}=await supabaseClient.from("profiles").update(payload).eq("id",currentUser.id).select().single();
  if(error) return alert(error.message);
  currentProfile=data; alert("Profile updated."); render();
}
function startWorkout(day){ const w=PROGRAM.find(x=>x.day===day); activeSession={id:Date.now(),date:new Date().toISOString(),workout:w.day,exercises:w.exercises}; saveActive(); renderSession(); }
function renderSession(){ activeView="today"; el("today").innerHTML=`<div class="card"><div class="row space"><div><h2>${activeSession.workout}</h2><p class="muted">Workout in progress.</p></div><button class="green" onclick="finishWorkout()">Finish workout</button></div></div>${activeSession.exercises.map(e=>`<div class="card"><h3>${e[1]}</h3><p class="muted">${e[0]} · ${e[2]} x ${e[3]} ${e[4]}</p></div>`).join("")}`; show("today",true); }
function finishWorkout(){ const d=getStore(); d.sessions.push(activeSession); setStore(d); clearActive(); activeSession=null; alert("Workout saved."); activeView="progress"; render(); }
function previewWorkout(day){ const w=PROGRAM.find(x=>x.day===day); modalBody.innerHTML=`<h2>${w.day}</h2>${w.exercises.map(e=>`<div class="exercise"><b>${e[0]}:</b> ${e[1]} · ${e[2]} x ${e[3]} ${e[4]}</div>`).join("")}`; el("modal").classList.add("show"); }
function closeModal(){ el("modal").classList.remove("show"); }
async function logout(){ await supabaseClient.auth.signOut(); currentUser=null; currentProfile=null; activeSession=null; render(); }

init().then(setupAuthListener);
</script>
</body>
</html>
