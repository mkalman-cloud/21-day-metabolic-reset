<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forge v4.8 Rest Timer Dashboard</title>
  <meta name="theme-color" content="#020817" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    :root{
      --bg:#020817;--card:#0f172a;--card2:#111827;--line:#26344d;--text:#f8fafc;--muted:#94a3b8;
      --green:#34d399;--blue:#60a5fa;--red:#fb7185;--yellow:#facc15;--purple:#8b5cf6;
    }
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at top,#172554,#020817 55%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
    header{position:sticky;top:0;z-index:10;background:rgba(2,8,23,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08)}
    .top{max-width:1180px;margin:auto;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
    .brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#64748b,#0f172a);border:1px solid #475569;display:grid;place-items:center;font-weight:900}
    main{max-width:1400px;margin:auto;padding:16px} h1,h2,h3{margin:0 0 10px}.muted,.sub{color:var(--muted)}.small{font-size:12px}
    .card{background:linear-gradient(180deg,rgba(15,23,42,.96),rgba(17,24,39,.96));border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
    .banner{background:linear-gradient(135deg,#1e3a8a,#312e81)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
    input,select,textarea{width:100%;background:#07111f;border:1px solid var(--line);border-radius:14px;padding:13px;color:var(--text);font:inherit;margin-bottom:8px}
    textarea{min-height:90px} label{display:block;margin:8px 0 4px;color:var(--muted);font-size:12px}
    button{border:0;border-radius:14px;padding:12px 15px;font-weight:800;cursor:pointer;background:var(--blue);color:#06101f}
    button:hover{filter:brightness(1.05)} button:disabled{opacity:.5;cursor:not-allowed}
    .green{background:var(--green)}.secondary{background:#1f2937;color:white;border:1px solid var(--line)}.red{background:#3b1220;color:#fecdd3;border:1px solid #7f1d1d}.full{width:100%}
    .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.tab{background:#111827;color:var(--muted);border:1px solid var(--line)}.tab.active{background:white;color:#020817}
    .hide{display:none!important}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}
    .pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--muted);font-size:12px;margin:3px;background:#07111f}.pill.green{color:#bbf7d0;border-color:#14532d}.pill.yellow{color:#fde68a;border-color:#713f12}.pill.red{color:#fecdd3;border-color:#7f1d1d}
    .exercise{border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;background:#08111f}.miniTabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}.miniTab{background:#111827;color:var(--muted);border:1px solid var(--line)}.miniTab.active{background:#e5e7eb;color:#020817}.alertBox{border-left:4px solid var(--yellow);padding:10px;background:#111827;border-radius:12px;margin:8px 0}.alertBox.redFlag{border-left-color:var(--red)}
    .setrow{display:grid;grid-template-columns:36px 1fr 1fr 46px;gap:8px;margin:8px 0;align-items:center}.done{background:var(--green)}.sessionBar{position:sticky;top:78px;z-index:8;background:#0f172a;border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px}.progressLine{height:8px;background:#07111f;border-radius:999px;overflow:hidden;border:1px solid var(--line)}.progressFill{height:100%;background:var(--green);width:0%}.logHint{font-size:12px;color:var(--muted);margin-top:-4px;margin-bottom:8px}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;z-index:50}.modal.show{display:flex}
    .sheet{width:100%;max-width:980px;margin:0 auto;background:#0f172a;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:16px;max-height:88vh;overflow:auto}
    canvas{width:100%;height:240px;background:#07111f;border:1px solid var(--line);border-radius:16px}

    .sessionGrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
    .restPanel{position:sticky;top:92px}
    .timerCircle{width:170px;height:170px;border-radius:50%;border:10px solid rgba(52,211,153,.35);display:grid;place-items:center;margin:18px auto;background:radial-gradient(circle,#0f172a,#07111f);box-shadow:0 0 30px rgba(52,211,153,.16)}
    .timerTime{font-size:40px;font-weight:900;color:var(--text);letter-spacing:1px;text-align:center}
    .timerLabel{font-size:13px;color:var(--muted);text-align:center;margin-top:4px}
    .quickPresets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
    .overviewRow{display:flex;justify-content:space-between;gap:12px;margin:8px 0;color:var(--muted)}
    .overviewRow b{color:var(--text)}
    @media(max-width:900px){.sessionGrid{grid-template-columns:1fr}.restPanel{position:relative;top:auto}.quickPresets{grid-template-columns:repeat(2,1fr)}}
    .scoreBig{font-size:42px;font-weight:900;line-height:1;margin:8px 0}.scoreBar{height:12px;background:#07111f;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:10px 0}.scoreFill{height:100%;background:var(--green);width:0%}.scoreFill.yellowFill{background:var(--yellow)}.scoreFill.redFill{background:var(--red)}.insight{border-left:4px solid var(--blue);padding:10px;background:#08111f;border-radius:12px;margin:8px 0}.insight.greenFlag{border-left-color:var(--green)}.insight.yellowFlag{border-left-color:var(--yellow)}.insight.redFlag{border-left-color:var(--red)}
    @media(max-width:760px){.tabs{grid-template-columns:repeat(2,1fr)}.setrow{grid-template-columns:30px 1fr 1fr 40px}.top{align-items:flex-start}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand"><div class="logo">F</div><div><h2>Move With Intent</h2><div class="sub" id="profileLine">Forge Cloud</div></div></div>
    <button id="topLogout" class="secondary hide" onclick="logout()">Log out</button>
  </div>
</header>

<main>
  <div id="status" class="card banner"><h1>Forge</h1><p class="muted">Syncing Forge Cloud...</p></div>

  <section id="authView">
    <div class="grid">
      <div class="card">
        <h2>Log in</h2>
        <input id="loginEmail" placeholder="Email" autocomplete="email">
        <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
        <button class="green full" onclick="login()">Log in</button>
      </div>
      <div class="card">
        <h2>Create client account</h2>
        <input id="signupName" placeholder="Full name">
        <input id="signupEmail" placeholder="Email">
        <input id="signupPassword" type="password" placeholder="Password">
        <input id="signupDob" type="date">
        <input id="signupEmergencyName" placeholder="Emergency contact name">
        <input id="signupEmergencyPhone" placeholder="Emergency contact phone">
        <button class="green full" onclick="signup()">Create account</button>
        <p class="muted small">Clients are automatically assigned to Marcell as coach.</p>
      </div>
    </div>
  </section>

  <section id="appView" class="hide">
    <div id="tabs" class="tabs"></div>
    <div id="phaseBand"></div>
    <div id="today" class="view"></div>
    <div id="program" class="view hide"></div>
    <div id="clients" class="view hide"></div>
    <div id="profile" class="view hide"></div>
    <div id="settings" class="view hide"></div>
  </section>
</main>

<div id="modal" class="modal"><div class="sheet"><div id="modalBody"></div><button class="secondary full" onclick="closeModal()">Close</button></div></div>

<script>
const PERMANENT_COACH_EMAIL="marcell.fitness@gmail.com";
let supabaseClient=null,currentUser=null,currentProfile=null,clientState=null,activeView="today",activeSession=null,trainAsClient=false;
let restTimer=null,restSeconds=90,restRemaining=90,restRunning=false;

const PHASES=[
  ["Foundation","Weeks 1-6","Technique · control · base conditioning"],
  ["Strength Build","Weeks 7-12","Progressive overload · strength increase"],
  ["Intensification","Weeks 13-18","Heavier work · power output"],
  ["Performance","Weeks 19-24","Strength + conditioning · athletic look"]
];

const PROGRAMS={
  forge_hybrid:{
    name:"Forge Hybrid 3-Day",
    description:"Functional strength, conditioning, bodyweight control, and athletic work.",
    schedule:[
      {day:"Day 1 - Lower Body Strength + Engine",schedule:"Monday",exercises:[["Warm-Up","Incline treadmill walk",1,5,"min","incline"],["Warm-Up","Bodyweight squats",1,15,"reps","bodyweight"],["Warm-Up","Lunges",1,10,"each leg","bodyweight"],["Main Lift","Barbell Squat",5,5,"reps","main"],["Secondary","Romanian Deadlift",3,8,"reps","other"],["Secondary","Leg Press",3,10,"reps","other"],["Secondary","Leg Extension",3,12,"reps","other"],["Conditioning","Incline treadmill walk",1,12,"min","incline"],["Finisher","Plank",2,60,"seconds","duration_bodyweight"]]},
      {day:"Day 2 - Upper Body Strength + Work Capacity",schedule:"Wednesday",exercises:[["Warm-Up","Row machine",1,5,"min","duration"],["Main Lift","Bench Press",5,5,"reps","main"],["Secondary","Lat Pulldown or Pull-ups",3,10,"reps","other"],["Secondary","Seated Row",3,10,"reps","other"],["Functional","Dumbbell Shoulder Press",3,10,"reps","other"],["Conditioning","Bike steady pace, green zone",1,12,"min","duration"]]},
      {day:"Day 3 - Full Body Strength + Conditioning",schedule:"Friday",exercises:[["Warm-Up","Row machine",1,5,"min","duration"],["Main Lift","Deadlift",5,5,"reps","main"],["Power","Push Press",3,6,"reps","other"],["Secondary","Leg Extension",3,12,"reps","other"],["Conditioning","Treadmill intervals, 1 min run / 1 min walk",8,1,"round","speed"],["Finisher","Push-ups",2,12,"reps","bodyweight"],["Finisher","Plank",1,60,"seconds","duration_bodyweight"]]}
    ]
  },
  metabolic_21:{
    name:"21-Day Metabolic Reset",
    description:"A 21-day reset focused on consistency, conditioning, mobility, simple strength work, and habit momentum.",
    schedule:[
      {day:"Day 1 - Reset Strength + Zone 2",schedule:"Monday",exercises:[["Warm-Up","Incline treadmill walk",1,6,"min","incline"],["Mobility","Hip openers",1,60,"seconds","duration_bodyweight"],["Strength","Goblet Squat",3,10,"reps","other"],["Strength","Dumbbell Bench Press",3,10,"reps","other"],["Strength","Seated Row",3,12,"reps","other"],["Core","Plank",2,45,"seconds","duration_bodyweight"],["Conditioning","Bike steady pace",1,15,"min","duration"]]},
      {day:"Day 2 - Conditioning + Core",schedule:"Wednesday",exercises:[["Warm-Up","Row machine",1,5,"min","duration"],["Conditioning","Treadmill intervals, 1 min run / 1 min walk",8,1,"round","speed"],["Strength","Leg Extension",3,12,"reps","other"],["Strength","Lat Pulldown",3,12,"reps","other"],["Core","Cable Woodchoppers",3,12,"each side","other"],["Cool Down","Incline treadmill walk",1,8,"min","incline"]]},
      {day:"Day 3 - Full Body Reset",schedule:"Friday",exercises:[["Warm-Up","Bike easy pace",1,5,"min","duration"],["Strength","Leg Press",3,12,"reps","other"],["Strength","Dumbbell Shoulder Press",3,10,"reps","other"],["Strength","Romanian Deadlift",3,10,"reps","other"],["Bodyweight","Push-ups",3,12,"reps","bodyweight"],["Core","Plank",3,45,"seconds","duration_bodyweight"],["Conditioning","Row machine steady pace",1,12,"min","duration"]]}
    ]
  },
  stronglifts_5x5:{
    name:"StrongLifts 5×5",
    description:"Simple compound barbell strength program for strength, muscle, and athleticism. Squat every workout. Add weight gradually.",
    schedule:[
      {day:"Workout A - Squat, Bench, Row",schedule:"Monday",exercises:[["Main Lift","Barbell Back Squat",5,5,"reps","main"],["Main Lift","Barbell Bench Press",5,5,"reps","main"],["Main Lift","Barbell Row",5,5,"reps","main"],["Optional","Plank",3,45,"seconds","duration_bodyweight"]]},
      {day:"Workout B - Squat, Overhead Press, Deadlift",schedule:"Wednesday",exercises:[["Main Lift","Barbell Back Squat",5,5,"reps","main"],["Main Lift","Barbell Overhead Press",5,5,"reps","main"],["Main Lift","Barbell Deadlift",1,5,"reps","main"],["Optional","Incline treadmill walk",1,10,"min","incline"]]},
      {day:"Workout A/B Alternating - Follow Week Cycle",schedule:"Friday",exercises:[["Main Lift","Barbell Back Squat",5,5,"reps","main"],["Main Lift","Alternate Bench or Overhead Press",5,5,"reps","main"],["Main Lift","Alternate Row or Deadlift",5,5,"reps","main"],["Note","Add weight every 2-week cycle. Lower body 5-10% or 4.5kg max. Upper body 5-10% or 2.3kg max.",1,1,"note","note"]]}
    ]
  }
};

function el(id){return document.getElementById(id)}
function showStatus(text,ok=true){el("status").innerHTML=`<h1>Forge</h1><p class="muted">${ok?"✅":"❌"} ${text}</p>`}
function hideStatus(){setTimeout(()=>el("status").classList.add("hide"),800)}
function isCoach(){return currentProfile?.role==="coach"}
function isClientView(){return !isCoach() || trainAsClient}
function isCoachEmail(email){return String(email||"").toLowerCase()===PERMANENT_COACH_EMAIL}
function programKey(){return clientState?.program_key||"forge_hybrid"}
function program(){return PROGRAMS[programKey()]||PROGRAMS.forge_hybrid}
function week(){return clientState?.current_week||1}
function phaseIndex(){return Math.min(3,Math.floor((week()-1)/6))}

async function init(){
  try{
    if(!window.STRONG_WEEK_CONFIG) throw new Error("Missing config.js");
    supabaseClient=window.supabase.createClient(window.STRONG_WEEK_CONFIG.supabaseUrl,window.STRONG_WEEK_CONFIG.supabaseAnonKey);
    const {data,error}=await supabaseClient.auth.getSession(); if(error) throw error;
    currentUser=data.session?.user||null;
    if(currentUser){await loadProfile(); await loadClientState(currentProfile.id); loadActiveSession();}
    showStatus("Forge Cloud ready"); hideStatus(); render();
    supabaseClient.auth.onAuthStateChange(async(e,s)=>{currentUser=s?.user||null;if(currentUser){await loadProfile();await loadClientState(currentProfile.id);loadActiveSession()}render()});
  }catch(err){console.error(err);showStatus(err.message||String(err),false)}
}

async function getCoachProfile(){const {data}=await supabaseClient.from("profiles").select("*").eq("email",PERMANENT_COACH_EMAIL).maybeSingle();return data}

async function loadProfile(){
  const {data,error}=await supabaseClient.from("profiles").select("*").eq("id",currentUser.id).maybeSingle();
  if(error) console.warn(error);
  if(data){currentProfile=data}else{
    const coach=isCoachEmail(currentUser.email)?null:await getCoachProfile();
    const payload={id:currentUser.id,email:currentUser.email,full_name:currentUser.email,role:isCoachEmail(currentUser.email)?"coach":"client",coach_id:isCoachEmail(currentUser.email)?null:(coach?.id||null)};
    await supabaseClient.from("profiles").insert(payload); currentProfile=payload;
  }
  if(isCoachEmail(currentUser.email)&&currentProfile.role!=="coach"){
    await supabaseClient.from("profiles").update({role:"coach",coach_id:null,email:currentUser.email}).eq("id",currentUser.id);
    currentProfile.role="coach"; currentProfile.coach_id=null;
  }
}

async function loadClientState(clientId){
  const {data}=await supabaseClient.from("client_states").select("*").eq("client_id",clientId).maybeSingle();
  if(data){clientState=data;return data}
  const {data:newState}=await supabaseClient.from("client_states").insert({client_id:clientId,current_week:1,week_locked:false,program_key:"forge_hybrid"}).select().single();
  clientState=newState||{client_id:clientId,current_week:1,week_locked:false,program_key:"forge_hybrid"};return clientState;
}

async function login(){
  try{
    const email=el("loginEmail").value.trim(), password=el("loginPassword").value.trim();
    if(!email||!password) return alert("Enter email and password.");
    const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
    if(error) return alert(error.message);
    currentUser=data.user; await loadProfile(); await loadClientState(currentProfile.id); activeView="today"; render();
  }catch(err){console.error(err);alert("Login error: "+(err.message||err))}
}

async function signup(){
  try{
    const email=el("signupEmail").value.trim(), password=el("signupPassword").value.trim(), name=el("signupName").value.trim();
    const dob=el("signupDob").value, eName=el("signupEmergencyName").value.trim(), ePhone=el("signupEmergencyPhone").value.trim();
    if(!email||!password||!name) return alert("Add name, email and password.");
    if(!isCoachEmail(email)){
      if(!dob||!eName||!ePhone) return alert("Clients must add DOB and emergency contact details.");
      if(name.toLowerCase()===eName.toLowerCase()) return alert("Emergency contact cannot be the same person as client.");
    }
    const coach=isCoachEmail(email)?null:await getCoachProfile();
    const {data,error}=await supabaseClient.auth.signUp({email,password}); if(error) return alert(error.message);
    if(data.user){
      await supabaseClient.from("profiles").insert({id:data.user.id,email,full_name:name,role:isCoachEmail(email)?"coach":"client",coach_id:isCoachEmail(email)?null:(coach?.id||null),date_of_birth:isCoachEmail(email)?null:dob,emergency_contact_name:isCoachEmail(email)?"":eName,emergency_contact_phone:isCoachEmail(email)?"":ePhone});
      await supabaseClient.from("client_states").insert({client_id:data.user.id,current_week:1,week_locked:false,program_key:"forge_hybrid"});
    }
    alert("Account created. Check email if confirmation is required.");
  }catch(err){console.error(err);alert("Signup error: "+(err.message||err))}
}

async function logout(){
  try{await supabaseClient.auth.signOut({scope:"global"})}catch(e){console.warn(e)}
  localStorage.clear();sessionStorage.clear();currentUser=null;currentProfile=null;clientState=null;location.href=location.pathname+"?logout="+Date.now();
}


function enterTrainAsClient(){
  trainAsClient=true;
  activeView="today";
  render();
}

function exitTrainAsClient(){
  if(activeSession){
    const ok=confirm("You have a workout in progress. Return to coach mode anyway? You can resume it later from Train as Client.");
    if(!ok)return;
  }
  trainAsClient=false;
  activeView="today";
  render();
}

function render(){
  const logged=!!currentUser;
  el("authView").classList.toggle("hide",logged); el("appView").classList.toggle("hide",!logged); el("topLogout").classList.toggle("hide",!logged);
  if(!logged){el("profileLine").textContent="Forge Cloud";return}
  el("profileLine").textContent=`${currentProfile.full_name||currentUser.email} · ${trainAsClient ? "training as client" : currentProfile.role}`;
  renderTabs(); renderPhase(); renderToday(); renderProgram(); renderClients(); renderProfile(); renderSettings(); show(activeView,true);
}

function renderTabs(){
  const items=(isCoach() && !trainAsClient)
    ? [["today","Dashboard"],["program","Programs"],["clients","Clients"],["settings","Settings"]]
    : [["today","Today"],["program","Program"],["profile","Profile"],["settings","Settings"]];

  el("tabs").innerHTML=items.map(([v,l])=>`<button class="tab ${activeView===v?"active":""}" onclick="show('${v}')">${l}</button>`).join("");
}

function show(v,silent=false){
  if(v==="clients"&&(!isCoach() || trainAsClient)) v="today";
  activeView=v; document.querySelectorAll(".view").forEach(x=>x.classList.add("hide")); el(v)?.classList.remove("hide");
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.textContent.toLowerCase()===v));
  if(!silent) render();
}

function renderPhase(){
  const p=PHASES[phaseIndex()];
  el("phaseBand").innerHTML=`<div class="card banner"><div class="row space"><div><h2>📅 Phase ${phaseIndex()+1} - ${p[0]}</h2><p class="muted">${p[1]} · ${p[2]}</p></div><span class="pill ${clientState?.week_locked?"yellow":"green"}">Week ${week()} ${clientState?.week_locked?"Locked":"Auto"}</span></div></div>`;
}

function todayWorkout(){const d=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date().getDay()];return program().schedule.find(w=>w.schedule===d)||program().schedule[0]}
function workoutCard(w){return `<div class="card"><div class="row space"><div><h2>${w.day}</h2><span class="pill">${w.schedule}</span><span class="pill">${program().name}</span><span class="pill">Week ${week()}</span></div><div class="row"><button class="secondary" onclick="previewWorkout('${esc(w.day)}')">Open</button><button class="green" onclick="preWorkoutCheckin('${esc(w.day)}')">Start</button></div></div></div>`}

function renderToday(){
  if(isCoach() && !trainAsClient){
    el("today").innerHTML=`
      <div class="card banner">
        <h2>Coach Dashboard</h2>
        <p class="muted">Manage clients, programs, recovery alerts, workout progress, and readiness intelligence.</p>
      </div>
      <div class="grid">
        <div class="card">
          <h3>Train as Client</h3>
          <p class="muted">Use your coach account as a client to log your own workouts and test the client experience.</p>
          <button class="green full" onclick="enterTrainAsClient()">Train as Client</button>
        </div>
        <div class="card">
          <h3>Client Management</h3>
          <p class="muted">Open Clients to assign programs, lock weeks, view progress and recovery alerts.</p>
          <button class="secondary full" onclick="show('clients')">Open Clients</button>
        </div>
      </div>
      <div id="coachIntelligenceHost" class="card"><h3>Readiness Intelligence</h3><p class="muted">Loading client readiness...</p></div>
    `;
    setTimeout(renderCoachIntelligence,80);
    return;
  }

  el("today").innerHTML=`
    ${trainAsClient ? `<div class="card banner"><div class="row space"><div><h2>Train as Client Mode</h2><p class="muted">You are logging your own workout using the client experience.</p></div><button class="secondary" onclick="exitTrainAsClient()">Return to Coach Mode</button></div></div>` : ""}
    <div id="clientReadinessHost" class="card"><h3>Readiness</h3><p class="muted">Loading readiness...</p></div>
    <div class="card">
      <h2>Today</h2>
      <p class="muted">Your assigned program is <b>${program().name}</b>.</p>
    </div>
    ${activeSession
      ? `<div class="card banner"><h2>Workout in progress</h2><p>${activeSession.workout}</p><p class="muted">${completedSetCount()} of ${totalSetCount()} sets completed.</p><button class="green" onclick="renderSession()">Resume workout</button></div>`
      : workoutCard(todayWorkout())
    }
  `;
  setTimeout(()=>renderClientReadiness(currentProfile.id,"clientReadinessHost"),80);
}
function renderProgram(){
  if(isCoach() && !trainAsClient){
    el("program").innerHTML=`
      <div class="card banner">
        <h2>Programs</h2>
        <p class="muted">Programs available for assignment to clients.</p>
      </div>
      ${Object.keys(PROGRAMS).map(k=>`
        <div class="card">
          <h2>${PROGRAMS[k].name}</h2>
          <p class="muted">${PROGRAMS[k].description}</p>
          ${PROGRAMS[k].schedule.map(w=>`<div class="exercise"><b>${w.day}</b><p class="muted">${w.schedule} · ${w.exercises.length} items</p></div>`).join("")}
        </div>
      `).join("")}
    `;
    return;
  }

function label1(e){return e.type==="speed"?"Speed Level":e.type==="incline"?"Incline Level":(e.type==="bodyweight"||e.type==="duration_bodyweight")?"Body Weight":e.type==="duration"?"Completed duration":e.type==="note"?"Note":"kg"}
function label2(e){return (e.type==="duration"||e.type==="duration_bodyweight")?"min/sec":e.type==="speed"?"Speed/round":e.type==="incline"?"duration":e.type==="note"?"":"reps"}

    <label>Workout difficulty</label><select id="postDifficulty"><option>Had plenty left</option><option>Just right</option><option>I am buggered</option></select>
    <button class="green full" onclick="finishWorkout()">Save workout</button>`;
  el("modal").classList.add("show");
}

async function finishWorkout(){
  if(!activeSession)return alert("No active workout.");

  const duration=Math.round((Date.now()-activeSession.start)/60000)||1;
  const completed=completedSetCount();
  const total=totalSetCount();

  if(completed===0){
    if(!confirm("No completed sets are ticked. Save workout anyway?")) return;
  }

  const {data:s,error}=await supabaseClient.from("workout_sessions").insert({
    client_id:currentProfile.id,
    coach_id:currentProfile.coach_id,
    week:activeSession.week,
    workout_name:activeSession.workout,
    duration_minutes:duration
  }).select().single();

  if(error)return alert(error.message);

  const rows=activeSession.exercises.flatMap(e=>e.logs
    .filter(l=>l.done || l.value || l.reps)
    .map(l=>({
      session_id:s.id,
      client_id:currentProfile.id,
      exercise:e.name,
      exercise_type:e.type,
      week:activeSession.week,
      set_number:l.set,
      metric_value:Number(l.value)||0,
      reps_or_duration:Number(l.reps)||0,
      unit:e.unit,
      comment:e.comment||""
    }))
  );

  if(rows.length){
    const {error:logError}=await supabaseClient.from("exercise_logs").insert(rows);
    if(logError)return alert("Workout saved but exercise logs failed: "+logError.message);
  }

  const {error:recError}=await supabaseClient.from("recovery_logs").insert({
    session_id:s.id,
    client_id:currentProfile.id,
    week:activeSession.week,
    pre_energy:activeSession.pre.energy,
    pre_sleep:activeSession.pre.sleep,
    pre_body_comfort:activeSession.pre.body,
    post_body_comfort:el("postBody").value,
    workout_difficulty:el("postDifficulty").value
  });

  if(recError)return alert("Workout saved but recovery log failed: "+recError.message);

  await maybeProgressWeek(currentProfile.id);

  activeSession=null;
  clearActiveSession();
  closeModal();
  alert("Workout saved. Completed "+completed+" of "+total+" sets in "+duration+" min.");
  await loadClientState(currentProfile.id);
  activeView=(isCoach() && !trainAsClient)?"clients":"profile";
  render();
}

async function maybeProgressWeek(clientId){
  const st=await loadClientState(clientId); if(st.week_locked) return;
  const {count}=await supabaseClient.from("workout_sessions").select("*",{count:"exact",head:true}).eq("client_id",clientId).eq("week",st.current_week);
  const {data:lastRec}=await supabaseClient.from("recovery_logs").select("*").eq("client_id",clientId).order("created_at",{ascending:false}).limit(1).maybeSingle();
  const score=readinessScore(lastRec);
  // Smart progression v1: 3 workouts are still required, but low readiness prevents automatic progression.
  if((count||0)>=3 && score>=55){
    await supabaseClient.from("client_states").update({current_week:st.current_week+1}).eq("client_id",clientId);
  }
}

  const {data:logs=[]}=await supabaseClient.from("exercise_logs").select("*").eq("client_id",id);
  const {data:recovery=[]}=await supabaseClient.from("recovery_logs").select("*").eq("client_id",id).order("created_at",{ascending:true});
  const html=`${readinessCard(recovery,"Current Readiness")}<div class="card"><h2>Progress + Charts</h2><p class="muted">${sessions.length} completed workouts.</p></div><div class="grid"><div class="card"><h3>Readiness / session</h3><canvas id="readinessChart"></canvas></div><div class="card"><h3>Kg / week</h3><canvas id="kgChart"></canvas></div><div class="card"><h3>Speed / week</h3><canvas id="speedChart"></canvas></div><div class="card"><h3>Duration / week</h3><canvas id="durationChart"></canvas></div><div class="card"><h3>Recovery before/after</h3><canvas id="recoveryChart"></canvas></div></div><div class="card"><h3>Workout history</h3>${sessions.map(s=>`<div class="exercise"><b>${s.workout_name}</b><p class="muted">Week ${s.week} · ${s.duration_minutes} min · ${new Date(s.created_at).toLocaleString()}</p></div>`).join("")||"<p class='muted'>No workouts yet.</p>"}</div>`;
  if(asModal){el("modalBody").innerHTML=html;el("modal").classList.add("show")}else{el("profile").innerHTML+=html}
  setTimeout(()=>drawAllCharts(logs,recovery),80);
}

function renderProfile(){
  if(isCoach() && !trainAsClient){el("profile").innerHTML="";return}

  el("profile").innerHTML=`
    ${trainAsClient ? `<div class="card banner"><div class="row space"><div><h2>My Training Profile</h2><p class="muted">Coach account using client mode.</p></div><button class="secondary" onclick="exitTrainAsClient()">Return to Coach Mode</button></div></div>` : ""}
    <div class="card">
      <h2>Profile</h2>
      <p class="muted">${currentProfile.email}</p>
      <p><b>Program:</b> ${program().name}</p>
      <p><b>Current week:</b> ${week()}</p>
    </div>
    <div class="card">
      <h3>Workout Modification Request</h3>
      <p class="muted">Use this for pain/discomfort, equipment limitations, or exercise changes.</p>
      <textarea id="modRequestText" placeholder="What would you like changed?"></textarea>
      <button class="green full" onclick="submitModificationRequest()">Submit request</button>
    </div>`;
  renderProgressIntoProfile(currentProfile.id,false);
}

async function submitModificationRequest(){
  const txt=el("modRequestText").value.trim(); if(!txt)return alert("Write your request first.");
  const {error}=await supabaseClient.from("modification_requests").insert({client_id:currentProfile.id,coach_id:currentProfile.coach_id,request_text:txt,status:"open"});
  if(error)return alert(error.message); alert("Request submitted."); el("modRequestText").value="";
}


function latestRecovery(rows){
  if(!rows || !rows.length) return null;
  return [...rows].sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0))[0];
}

function readinessScore(r){
  if(!r) return 0;
  let score=0;
  score += r.pre_energy==="High energy" ? 25 : r.pre_energy==="Moderate energy" ? 18 : 8;
  score += r.pre_sleep==="Very good sleep, full of energy" ? 25 : r.pre_sleep==="Disturbed but good rest" ? 18 : r.pre_sleep==="Not disturbed but tired" ? 12 : 7;
  score += r.pre_body_comfort==="Comfortable and mobile" ? 20 : r.pre_body_comfort==="A little stiff" ? 13 : 4;
  score += r.post_body_comfort==="Better than before" ? 15 : r.post_body_comfort==="About the same" ? 10 : 2;
  score += r.workout_difficulty==="Had plenty left" ? 15 : r.workout_difficulty==="Just right" ? 12 : 3;
  return Math.max(0,Math.min(100,score));
}

function readinessLabel(score){
  if(score>=80) return "Ready to progress";
  if(score>=65) return "Train normally";
  if(score>=50) return "Hold progression";
  if(score>0) return "Recovery focus";
  return "No data yet";
}

function readinessClass(score){
  if(score>=65) return "green";
  if(score>=50) return "yellow";
  if(score>0) return "red";
  return "";
}

function scoreFillClass(score){
  if(score>=65) return "";
  if(score>=50) return "yellowFill";
  return "redFill";
}

function readinessRecommendation(score,r){
  if(!r) return "Complete your first recovery check-in to generate a training recommendation.";
  if(r.post_body_comfort==="Worse than before") return "Pain or body comfort worsened. Hold progression and review exercise selection before increasing load.";
  if(r.pre_body_comfort==="Aches/pains or very stiff") return "Body comfort was low before training. Consider mobility, reduced volume, or an easier variation next session.";
  if(score>=80) return "Strong readiness. Progression is appropriate if performance was completed with good technique.";
  if(score>=65) return "Good enough to train normally. Progress carefully and monitor recovery.";
  if(score>=50) return "Hold progression. Repeat the week or keep load stable until recovery improves.";
  return "Recovery focus recommended. Reduce intensity, use easier substitutions, or coach review before progressing.";
}

function readinessCard(rows,title="Readiness"){
  const r=latestRecovery(rows);
  const score=readinessScore(r);
  const label=readinessLabel(score);
  const cls=readinessClass(score);
  return `<div class="card">
    <div class="row space"><div><h3>${title}</h3><p class="muted">Smart training recommendation based on recovery check-ins.</p></div><span class="pill ${cls}">${label}</span></div>
    <div class="scoreBig">${score}/100</div>
    <div class="scoreBar"><div class="scoreFill ${scoreFillClass(score)}" style="width:${score}%"></div></div>
    <div class="insight ${cls?cls+'Flag':''}"><b>Recommendation:</b> ${readinessRecommendation(score,r)}</div>
    ${r?`<p class="muted small">Latest: Energy ${r.pre_energy||"N/A"} · Sleep ${r.pre_sleep||"N/A"} · Before ${r.pre_body_comfort||"N/A"} · After ${r.post_body_comfort||"N/A"} · Difficulty ${r.workout_difficulty||"N/A"}</p>`:`<p class="muted small">No recovery logs yet.</p>`}
  </div>`;
}

async function renderClientReadiness(clientId,hostId){
  const host=el(hostId); if(!host) return;
  const {data:recovery=[]}=await supabaseClient.from("recovery_logs").select("*").eq("client_id",clientId).order("created_at",{ascending:false});
  host.outerHTML=readinessCard(recovery,"Today’s Readiness");
}

async function renderCoachIntelligence(){
  const host=el("coachIntelligenceHost"); if(!host || !isCoach() || trainAsClient) return;
  const {data:clients=[]}=await supabaseClient.from("profiles").select("*").eq("coach_id",currentProfile.id).order("full_name",{ascending:true});
  if(!clients.length){host.innerHTML=`<h3>Readiness Intelligence</h3><p class="muted">No clients yet.</p>`;return;}
  const ids=clients.map(c=>c.id);
  const {data:recovery=[]}=await supabaseClient.from("recovery_logs").select("*").in("client_id",ids).order("created_at",{ascending:false});
  const rows=clients.map(c=>{
    const latest=latestRecovery(recovery.filter(r=>r.client_id===c.id));
    const score=readinessScore(latest);
    return {client:c,latest,score,label:readinessLabel(score),cls:readinessClass(score),recommendation:readinessRecommendation(score,latest)};
  }).sort((a,b)=>a.score-b.score);
  const attention=rows.filter(r=>r.score>0 && r.score<65);
  host.innerHTML=`
    <h3>Readiness Intelligence</h3>
    <p class="muted">Clients needing attention are shown first. Low scores should prompt recovery review before progression.</p>
    ${(attention.length?attention:rows).map(r=>`
      <div class="insight ${r.cls? r.cls+'Flag':''}">
        <div class="row space"><b>${r.client.full_name||r.client.email}</b><span class="pill ${r.cls}">${r.score}/100 - ${r.label}</span></div>
        <p class="muted">${r.recommendation}</p>
        <button class="secondary" onclick="openClient('${r.client.id}','alerts')">Open readiness</button>
      </div>
    `).join("")}
  `;
}

function readinessValues(rows){
  const m={};
  (rows||[]).slice().sort((a,b)=>new Date(a.created_at||0)-new Date(b.created_at||0)).forEach((r,i)=>{m[i+1]=readinessScore(r)});
  return m;
}

function drawAllCharts(logs,recovery){drawChart("readinessChart",readinessValues(recovery));drawChart("kgChart",group(logs,"main","metric_value"));drawChart("speedChart",group(logs,"speed","metric_value"));drawChart("durationChart",group(logs,"duration_bodyweight","reps_or_duration"));drawChart("recoveryChart",recoveryValues(recovery))}
function group(logs,type,field){const m={};logs.filter(x=>x.exercise_type===type).forEach(x=>m[x.week]=Math.max(m[x.week]||0,Number(x[field])||0));return m}
function recoveryValues(rows){const m={};rows.forEach((r,i)=>{m[i+1]=scoreRecovery(r)});return m}
function scoreRecovery(r){let s=0;s+=r.pre_energy==="High energy"?3:r.pre_energy==="Moderate energy"?2:1;s+=r.pre_body_comfort==="Comfortable and mobile"?3:r.pre_body_comfort==="A little stiff"?2:1;s+=r.post_body_comfort==="Better than before"?3:r.post_body_comfort==="About the same"?2:1;return s}
function drawChart(id,data){const c=el(id);if(!c)return;const ctx=c.getContext("2d");c.width=c.clientWidth*2;c.height=240*2;ctx.scale(2,2);ctx.clearRect(0,0,c.width,c.height);const keys=Object.keys(data),vals=keys.map(k=>data[k]),max=Math.max(1,...vals);ctx.strokeStyle="#60a5fa";ctx.lineWidth=3;ctx.beginPath();keys.forEach((k,i)=>{const x=30+i*((c.clientWidth-60)/Math.max(1,keys.length-1)),y=200-(vals[i]/max)*150;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);ctx.fillStyle="#94a3b8";ctx.fillText("W"+k,x-8,222);ctx.fillText(String(vals[i]),x-8,y-8)});ctx.stroke()}

function renderSettings(){
  el("settings").innerHTML=`
    <div class="card">
      <h2>Settings</h2>
      <p class="muted">${currentProfile.email} · ${trainAsClient ? "training as client" : currentProfile.role}</p>
      ${isCoach() ? `<button class="secondary full" onclick="${trainAsClient ? "exitTrainAsClient()" : "enterTrainAsClient()"}">${trainAsClient ? "Return to Coach Mode" : "Train as Client"}</button><br><br>` : ""}
      <button class="red full" onclick="logout()">Force log out</button>
    </div>`;
}



// --- Session and workout helper functions added in Forge v4.5 login fix ---
function storageKey(){
  return currentProfile?.id ? `forge_active_session_${currentProfile.id}` : "forge_active_session";
}

function loadActiveSession(){
  try{
    const raw = localStorage.getItem(storageKey());
    activeSession = raw ? JSON.parse(raw) : null;
  }catch(err){
    console.warn("Could not load active session", err);
    activeSession = null;
  }
}

function saveActiveSession(){
  try{
    if(activeSession) localStorage.setItem(storageKey(), JSON.stringify(activeSession));
  }catch(err){
    console.warn("Could not save active session", err);
  }
}

function clearActiveSession(){
  try{ localStorage.removeItem(storageKey()); }catch(err){ console.warn(err); }
}

function esc(str){
  return String(str ?? "").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"&quot;");
}

function findWorkout(day){
  const decoded = String(day ?? "").replace(/&quot;/g,'"');
  return program().schedule.find(w => w.day === decoded) || todayWorkout() || program().schedule[0];
}

function previewWorkout(day){
  const w = findWorkout(day);
  el("modalBody").innerHTML = `
    <div class="card banner">
      <h2>${w.day}</h2>
      <p class="muted">${program().name} · ${w.schedule} · Week ${week()}</p>
    </div>
    <div class="card">
      <h3>Workout Plan</h3>
      ${w.exercises.map(e=>`
        <div class="exercise">
          <b>${e[1]}</b>
          <p class="muted">${e[0]} · ${e[2]} x ${e[3]} ${e[4]}</p>
        </div>
      `).join("")}
      <button class="green full" onclick="preWorkoutCheckin('${esc(w.day)}')">Start workout</button>
    </div>`;
  el("modal").classList.add("show");
}

function totalSetCount(){
  if(!activeSession?.exercises) return 0;
  return activeSession.exercises.reduce((sum,e)=>sum + (e.logs?.length || 0),0);
}

function completedSetCount(){
  if(!activeSession?.exercises) return 0;
  return activeSession.exercises.reduce((sum,e)=>sum + (e.logs||[]).filter(l=>l.done).length,0);
}

function sessionCompletionPercent(){
  const total = totalSetCount();
  if(!total) return 0;
  return Math.round((completedSetCount()/total)*100);
}

function saveSet(exerciseIndex,setIndex,field,value){
  if(!activeSession?.exercises?.[exerciseIndex]?.logs?.[setIndex]) return;
  activeSession.exercises[exerciseIndex].logs[setIndex][field] = value;
  saveActiveSession();
}

function toggleSet(exerciseIndex,setIndex){
  if(!activeSession?.exercises?.[exerciseIndex]?.logs?.[setIndex]) return;
  const log = activeSession.exercises[exerciseIndex].logs[setIndex];
  log.done = !log.done;
  saveActiveSession();
  renderSession();
}

function cancelWorkout(){
  if(!activeSession) return;
  const ok = confirm("Cancel this workout? The current unsaved workout log will be removed from this device.");
  if(!ok) return;
  activeSession = null;
  clearActiveSession();
  render();
}


function formatRestTime(seconds){
  const safe=Math.max(0,Number(seconds)||0);
  const mins=Math.floor(safe/60);
  const secs=safe%60;
  return `${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;
}

function startRestTimer(seconds=restSeconds){
  clearInterval(restTimer);
  restSeconds=Number(seconds)||90;
  restRemaining=Number(seconds)||restSeconds;
  restRunning=true;
  updateRestTimerDisplay();
  renderRestControlsOnly();

  restTimer=setInterval(()=>{
    restRemaining=Math.max(0,restRemaining-1);
    updateRestTimerDisplay();
    if(restRemaining<=0){
      clearInterval(restTimer);
      restRunning=false;
      renderRestControlsOnly();
      try{ new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg").play(); }catch(e){}
      alert("Rest complete.");
    }
  },1000);
}

function pauseRestTimer(){
  clearInterval(restTimer);
  restRunning=false;
  renderRestControlsOnly();
}

function resetRestTimer(){
  clearInterval(restTimer);
  restRemaining=restSeconds;
  restRunning=false;
  updateRestTimerDisplay();
  renderRestControlsOnly();
}

function updateRestTimerDisplay(){
  const timerEl=document.getElementById("restTimerDisplay");
  if(timerEl) timerEl.textContent=formatRestTime(restRemaining);
}

function renderRestControlsOnly(){
  if(activeSession && activeView==="today"){
    renderSession();
  }
}

function closeModal(){el("modal").classList.remove("show")}
init();
</script>
